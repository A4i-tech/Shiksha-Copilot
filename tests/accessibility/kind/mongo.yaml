# Test-only mongod (no auth, emptyDir), ported from A4i-tech/kind-tests shiksha-kind-test/run.sh.
# The namespace LimitRange defaults containers to 512Mi, too little for mongod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiksha-mongo
  namespace: shiksha
spec:
  replicas: 1
  selector:
    matchLabels: {app: shiksha-mongo}
  template:
    metadata:
      labels: {app: shiksha-mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports: [{containerPort: 27017}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: shiksha-mongo, namespace: shiksha}
spec:
  selector: {app: shiksha-mongo}
  ports: [{port: 27017, targetPort: 27017}]
