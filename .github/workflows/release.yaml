name: Release

on:
  push:
    branches: [ "a4i/release", "feature/uat-docker-deploy" ]
  pull_request:
    branches: [ "a4i/release" ]
  workflow_dispatch:
    inputs:
      api_tag:
        description: "Skip ci-api and deploy this existing image tag instead (deploy-uat-only re-test)"
        required: false
        type: string
      be_tag:
        description: "Skip ci-backend and deploy this existing image tag instead"
        required: false
        type: string
      fe_tag:
        description: "Skip ci-frontend and deploy this existing image tag instead"
        required: false
        type: string

jobs:
  ci-api:
    if: github.event_name != 'workflow_dispatch' || inputs.api_tag == ''
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}
      update_cov_badge: false

  ci-backend:
    if: github.event_name != 'workflow_dispatch' || inputs.be_tag == ''
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}
      update_cov_badge: false

  ci-frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.fe_tag == ''
    uses: ./.github/workflows/ci-frontend.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}

  deploy-uat:
    name: Deploy to UAT host
    needs: [ci-api, ci-backend, ci-frontend]
    # ponytail: feature/uat-docker-deploy allowed here for the test run only —
    # drop it once verified, deploy should stay gated to a4i/release.
    # always() + per-job result check: lets this proceed when a ci-* job was
    # deliberately skipped (workflow_dispatch with an explicit *_tag input),
    # not just when all three actually ran.
    if: |
      always() &&
      contains(fromJSON('["success","skipped"]'), needs.ci-api.result) &&
      contains(fromJSON('["success","skipped"]'), needs.ci-backend.result) &&
      contains(fromJSON('["success","skipped"]'), needs.ci-frontend.result) &&
      (
        (github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy')) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, uat]
    environment: shiksha-uat
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default clean:true runs `git clean -ffdx` — the -x flag also wipes
          # gitignored files, including the host's persistent .env-data (mongo/
          # qdrant creds for docker-compose.data.yml). clean:false keeps that.
          # Service .env files are still fetched fresh from Key Vault every
          # deploy below (overwritten, not appended) — no stale-secret risk.
          clean: false

      - name: Azure login (SP client secret)
        # ponytail: existing SP already has vault access, no perms to add a
        # federated credential right now. Revisit OIDC once that's unblocked —
        # swap this step back, no other change needed.
        # azure/login@v2 has no separate client-secret input — secret-based
        # auth goes through the single `creds` JSON blob instead.
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Fetch service .env files from Key Vault
        run: |
          set -euo pipefail

          fetch_env() {
            local secret_name="$1" out_path="$2"
            az keyvault secret show \
              --vault-name "${{ vars.AZURE_KEYVAULT_NAME }}" \
              --name "$secret_name" \
              --query value -o tsv \
              | jq -r 'to_entries[] | "\(.key)=\(.value)"' > "$out_path"
            chmod 600 "$out_path"
            # not passed via secrets.* context — GitHub won't auto-mask these,
            # register each value explicitly so any accidental echo/log later
            # in the job comes out redacted.
            while IFS='=' read -r k v; do
              [ -n "$v" ] && echo "::add-mask::$v"
            done < "$out_path"
          }

          fetch_env "${{ vars.API_ENV_SECRET_NAME }}" shiksha-api/app-service/.env
          fetch_env "${{ vars.BE_ENV_SECRET_NAME }}"  shiksha-website/shiksha-backend/.env
          fetch_env "${{ vars.FE_ENV_SECRET_NAME }}"  shiksha-website/shiksha-frontend/.env

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up data stack (idempotent — no-op if already running)
        run: docker compose -f docker-compose.data.yml up -d

      - name: Wait for mongo + qdrant healthy
        run: |
          for i in $(seq 1 20); do
            m=$(docker inspect -f '{{.State.Health.Status}}' shiksha-mongo-uat-container)
            q=$(docker inspect -f '{{.State.Health.Status}}' shiksha-qdrant-uat-container)
            [ "$m" = "healthy" ] && [ "$q" = "healthy" ] && echo "data stack healthy" && exit 0
            echo "mongo=$m qdrant=$q, waiting... ($i/20)"; sleep 5
          done
          echo "data stack failed to become healthy"; exit 1

      - name: Pull + deploy app stack
        env:
          API_IMAGE_TAG: ${{ inputs.api_tag || needs.ci-api.outputs.tag_primary }}
          BE_IMAGE_TAG: ${{ inputs.be_tag || needs.ci-backend.outputs.tag_primary }}
          FE_IMAGE_TAG: ${{ inputs.fe_tag || needs.ci-frontend.outputs.tag_primary }}
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && echo "api OK" && break
            echo "waiting on api... ($i/15)"; sleep 5
          done
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && echo "backend OK" && break
            echo "waiting on backend... ($i/15)"; sleep 5
          done
