name: Release

on:
  push:
    branches: [ "a4i/release", "feature/uat-docker-deploy" ]
  pull_request:
    branches: [ "a4i/release" ]
  workflow_dispatch:

jobs:
  ci-api:
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}
      update_cov_badge: false

  ci-backend:
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}
      update_cov_badge: false

  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yaml
    secrets: inherit
    with:
      publish_staging: false
      publish_latest: false
      publish_uat: ${{ github.event_name == 'push' && (github.ref_name == 'a4i/release' || github.ref_name == 'feature/uat-docker-deploy') }}

  deploy-uat:
    name: Deploy to UAT host
    needs: [ci-api, ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref_name == 'a4i/release'
    runs-on: [self-hosted, uat]
    environment: uat
    permissions:
      id-token: write   # required for Azure OIDC login, no stored client secret
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Self-hosted runner: checkout runs `git clean -ffdx` each job,
        # wiping any .env left from a prior run. Env files are fetched
        # fresh from Key Vault below, every deploy — never assumed to persist.

      - name: Azure login (OIDC, no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch service .env files from Key Vault
        run: |
          set -euo pipefail

          fetch_env() {
            local secret_name="$1" out_path="$2"
            az keyvault secret show \
              --vault-name "${{ vars.AZURE_KEYVAULT_NAME }}" \
              --name "$secret_name" \
              --query value -o tsv \
              | jq -r 'to_entries[] | "\(.key)=\(.value)"' > "$out_path"
            chmod 600 "$out_path"
          }

          fetch_env api-env shiksha-api/app-service/.env
          fetch_env be-env  shiksha-website/shiksha-backend/.env

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up data stack (idempotent — no-op if already running)
        run: docker compose -f docker-compose.data.yml up -d

      - name: Wait for mongo + qdrant healthy
        run: |
          for i in $(seq 1 20); do
            m=$(docker inspect -f '{{.State.Health.Status}}' shiksha-mongo-uat-container)
            q=$(docker inspect -f '{{.State.Health.Status}}' shiksha-qdrant-uat-container)
            [ "$m" = "healthy" ] && [ "$q" = "healthy" ] && echo "data stack healthy" && exit 0
            echo "mongo=$m qdrant=$q, waiting... ($i/20)"; sleep 5
          done
          echo "data stack failed to become healthy"; exit 1

      - name: Pull + deploy app stack
        env:
          API_IMAGE_TAG: ${{ needs.ci-api.outputs.tag_primary }}
          BE_IMAGE_TAG: ${{ needs.ci-backend.outputs.tag_primary }}
          FE_IMAGE_TAG: ${{ needs.ci-frontend.outputs.tag_primary }}
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && echo "api OK" && break
            echo "waiting on api... ($i/15)"; sleep 5
          done
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && echo "backend OK" && break
            echo "waiting on backend... ($i/15)"; sleep 5
          done
