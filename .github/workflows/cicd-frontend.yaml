# Simple workflow for deploying static content
name: CI/CD Frontend

on:
  workflow_call:
    inputs:
      deploy_name:
        description: "Name of the deployment"
        required: true
        type: string
      api_url:
        description: "Backend API URL this frontend resource must call"
        required: true
        type: string
      deploy_target:
        description: "Deployment target: 'github-pages' or 'azure-blob'. Leave blank to skip deployment."
        required: false
        type: string
        default: ""
      azure_blob_container:
        description: "Azure Blob Storage container name (defaults to '$web' for static websites)"
        required: false
        type: string
        default: "$web"
    secrets:
      azure_connection_string:
        description: "Azure Storage connection string (required when deploy_target is 'azure-blob')"
        required: false
    outputs:
      page_url:
        description: "GitHub Pages deployment URL (empty when not deployed)"
        value: ${{ jobs.build.outputs.page_url }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.deploy_target != '' && inputs.deploy_name || '' }}
      url: ${{ inputs.deploy_target != '' && steps.deployment.outputs.page_url || '' }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    env:
      BACKEND_URL: ${{ inputs.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shiksha-website/shiksha-frontend/package-lock.json

      - name: Build Angular app
        working-directory: shiksha-website/shiksha-frontend
        run: |
          if [ "${{ inputs.deploy_target }}" != "" ]; then
            find src/environments -name "environment*.ts" -print \
              -exec sed -i "s|your_backend_url|${BACKEND_URL}|g" {} \;
          fi

          npm ci
          npm run build -- --configuration development \
            ${{ inputs.deploy_target == 'github-pages' && '--base-href /Shiksha-Copilot/' || '' }}

      - name: Setup Pages
        if: inputs.deploy_target == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: inputs.deploy_target == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: shiksha-website/shiksha-frontend/dist/shiksha-frontend

      - name: Deploy to GitHub Pages
        if: inputs.deploy_target == 'github-pages'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Azure Blob Storage
        if: inputs.deploy_target == 'azure-blob'
        uses: LanceMcCarthy/Action-AzureBlobUpload@v3
        with:
          connection_string: ${{ secrets.azure_connection_string }}
          container_name: ${{ inputs.azure_blob_container }}
          source_folder: shiksha-website/shiksha-frontend/dist/shiksha-frontend
          clean_destination_folder: true
          delete_if_exists: true
