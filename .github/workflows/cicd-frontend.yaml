# Simple workflow for deploying static content to GitHub Pages
name: CD GitHub Pages

on:
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BACKEND_URL: ${{ vars.FRONTEND_API_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular app
        working-directory: shiksha-website/shiksha-frontend
        run: |
          find src/environments -name "environment*.ts" -print -exec sed -i "s|your_backend_url|${BACKEND_URL}|g" {} \;
          npm ci
          npm run build -- --configuration development --base-href /Shiksha-Copilot/

      - name: Check build output
        run: ls -R shiksha-website/shiksha-frontend/dist/shiksha-frontend

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shiksha-website/shiksha-frontend/dist/shiksha-frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
