# Simple workflow for deploying static content
name: CI/CD Frontend

on:
  workflow_call:
    inputs:
      deploy_name:
        description: "Name of the deployment"
        required: true
        type: string
      environment:
        description: "Environment to build the frontend for"
        required: true
        type: string
      api_url:
        description: "Backend API URL this frontend resource must call"
        required: true
        type: string
      turnstile_site_key:
        description: "Cloudflare Turnstile site key; leave blank to disable CAPTCHA"
        required: false
        type: string
        default: ""
      superset_url:
        description: "Superset base URL (e.g. https://superset.example.com)"
        required: false
        type: string
        default: ""
      superset_dashboard_uuid:
        description: "Superset desktop dashboard UUID"
        required: false
        type: string
        default: ""
      superset_mobile_dashboard_uuid:
        description: "Superset mobile dashboard UUID"
        required: false
        type: string
        default: ""
      deploy_target:
        description: "Deployment target: 'github-pages' or 'azure-swa'. Leave blank to skip deployment."
        required: false
        type: string
        default: ""
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        description: "Azure static web app deployment token (required when deploy_target is 'azure-swa')"
        required: false
    outputs:
      page_url:
        description: "GitHub Pages deployment URL (empty when not deployed)"
        value: ${{ jobs.build.outputs.page_url }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.deploy_target != '' && inputs.deploy_name || '' }}
      url: ${{ steps.deployment.outputs.page_url || steps.deploy-azure-swa.outputs.static_web_app_url || '' }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deploy-azure-swa.outputs.static_web_app_url }}

    env:
      BACKEND_URL: ${{ inputs.api_url }}
      TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
      SUPERSET_URL: ${{ inputs.superset_url }}
      SUPERSET_DASHBOARD_UUID: ${{ inputs.superset_dashboard_uuid }}
      SUPERSET_MOBILE_DASHBOARD_UUID: ${{ inputs.superset_mobile_dashboard_uuid }}
      SHIKSHA_COPILOT_BUILD: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shiksha-website/shiksha-frontend/package-lock.json

      - name: Build Angular app
        working-directory: shiksha-website/shiksha-frontend
        run: |
          if [ "${{ inputs.deploy_target }}" != "" ]; then
            find src/environments -name "environment*.ts" -print \
              -exec sed -i "s|your_backend_url|${BACKEND_URL}|g" {} \;
          fi
          find src/environments -name "environment*.ts" \
            -exec sed -i "s|your_turnstile_site_key|${TURNSTILE_SITE_KEY}|g" {} \; \
            -exec sed -i "s|your_superset_url|${SUPERSET_URL}|g" {} \; \
            -exec sed -i "s|your_superset_dashboard_uuid|${SUPERSET_DASHBOARD_UUID}|g" {} \; \
            -exec sed -i "s|your_superset_mobile_dashboard_uuid|${SUPERSET_MOBILE_DASHBOARD_UUID}|g" {} \;

          npm ci
          npm run build -- --configuration ${{ inputs.environment }} \
            ${{ inputs.deploy_target == 'github-pages' && '--base-href /Shiksha-Copilot/' || '' }}

      - name: Setup Pages
        if: inputs.deploy_target == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: inputs.deploy_target == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: shiksha-website/shiksha-frontend/dist/shiksha-frontend

      - name: Deploy to GitHub Pages
        if: inputs.deploy_target == 'github-pages'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Azure Static Web App
        id: deploy-azure-swa
        if: inputs.deploy_target == 'azure-swa'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: shiksha-website/shiksha-frontend/dist/shiksha-frontend
          skip_app_build: true
          output_location: ""