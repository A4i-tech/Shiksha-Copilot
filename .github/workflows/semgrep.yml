name: Semgrep

on:
  pull_request:
    branches: [a4i/staging]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep==1.179.0

      - name: Semgrep diff scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --baseline-commit "$(git rev-parse HEAD^1)" \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            --metrics off \
            --oss-only

      - name: Upload SARIF to code scanning
        if: always()
        # fork PRs get a read-only token here, upload would 403; don't fail the job on that
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
