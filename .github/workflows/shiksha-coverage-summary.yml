name: Shiksha Coverage Summary

on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  aggregate-coverage:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (contains(fromJSON('["push", "pull_request"]'), github.event_name))
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-shiksha-api-app-service
          path: coverage-artifacts/api

      - name: Download Backend coverage artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-shiksha-backend
          path: coverage-artifacts/backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate coverage summary
        continue-on-error: true
        run: python .github/scripts/shiksha_coverage_summary.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiksha-coverage-report
          path: |
            shiksha_coverage_report.md
            coverage-artifacts/
          retention-days: 30

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const postCoverageComment = require('./.github/scripts/post-coverage-comment.js');
            await postCoverageComment({ github, context });

      - name: Summary
        if: always()
        run: |
          echo "### 📊 Shiksha Coverage Summary" >> $GITHUB_STEP_SUMMARY
          [ -f "shiksha_coverage_report.md" ] && cat shiksha_coverage_report.md >> $GITHUB_STEP_SUMMARY || echo "⚠️ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
