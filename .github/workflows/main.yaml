name: CI

on:
  push:
    branches: [ "a4i/main", "a4i/staging"]
  pull_request:
    branches: [ "a4i/main", "a4i/staging" ]
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

jobs:
  ci-api:
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-backend:
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  shiksha-coverage-summary:
    needs: [ci-api, ci-backend]
    if: always()
    uses: ./.github/workflows/shiksha-coverage-summary.yml
    secrets: inherit

  cd-api-prod:
    name: Deploy api
    needs: ci-api
    if: github.event_name == 'push' && github.ref_name == 'a4i/main'
    uses: ./.github/workflows/deploy-azure-webapp.yml
    with:
      azure-webapp-name: ${{ vars.AZURE_WEBAPP_NAME_API }}
      image-tag: ${{ needs.ci-api.outputs['tag_primary'] }}
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}

  cd-backend-prod:
    name: Deploy backend
    needs: ci-backend
    if: github.event_name == 'push' && github.ref_name == 'a4i/main'
    uses: ./.github/workflows/deploy-azure-webapp.yml
    with:
      azure-webapp-name: ${{ vars.AZURE_WEBAPP_NAME_BACKEND }}
      image-tag: ${{ needs.ci-backend.outputs['tag_primary'] }}
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}

  cd-frontend-prod:
    needs: cd-backend-prod
    if: github.event_name == 'push' && github.ref_name == 'a4i/main'
    uses: ./.github/workflows/cicd-frontend.yaml
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    with:
      deploy_name: shiksha-frontend-prod
      deploy_target: azure-swa
      environment: production
      api_url: ${{ needs.cd-backend-prod.result == 'success' && format('{0}/api', needs.cd-backend-prod.outputs['service-url']) || '' }}
      turnstile_site_key: ${{ vars.TURNSTILE_SITE_KEY }}

  health-check:
    name: Health Check
    # Prod only, staging CD notification is separate work.
    needs: [cd-frontend-prod, cd-api-prod, cd-backend-prod]
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == 'a4i/main' &&
      needs.cd-frontend-prod.result == 'success' &&
      needs.cd-api-prod.result == 'success' &&
      needs.cd-backend-prod.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve URLs
        id: urls
        run: |
          echo "frontend=${{ needs.cd-frontend-prod.outputs.page_url }}" >> $GITHUB_OUTPUT
          echo "backend=${{ needs.cd-backend-prod.outputs['service-url'] }}" >> $GITHUB_OUTPUT
          echo "api=${{ needs.cd-api-prod.outputs['service-url'] }}" >> $GITHUB_OUTPUT

      - name: Verify Services
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend }}
          BACKEND_URL: ${{ steps.urls.outputs.backend }}
          API_URL: ${{ steps.urls.outputs.api }}
        run: |
          trap 'echo "Cancelled"; exit 1' TERM INT

          check_build() {
            local name=$1 url=$2
            local resp; resp=$(curl -sf --max-time 30 "$url") || { echo "FAIL $name unreachable"; return 1; }
            local build=$(echo "$resp" | jq -r '.build // empty')
            if [ "$build" = "$EXPECTED_BUILD" ]; then
              echo "PASS $name"
              return 0
            fi
            echo "FAIL $name build mismatch (got: '${build:-empty}', expected: '$EXPECTED_BUILD')"
            return 1
          }

          for ((i=1; i<=30; i++)); do
            echo "--- Attempt $i/30 ---"
            check_build "Frontend" "$FRONTEND_URL/health.json" && \
            check_build "Backend"  "$BACKEND_URL/health" && \
            check_build "API"      "$BACKEND_URL/health-api" && \
            { echo "All services on build $EXPECTED_BUILD"; exit 0; }
            sleep 15 & wait $!
          done

          echo "Timed out waiting for build $EXPECTED_BUILD"
          exit 1

  # The kind test jobs run only where secrets exist: not on fork PRs, and on PRs only into staging.
  accessibility-tests:
    name: Accessibility Tests
    needs: [ci-api, ci-backend, ci-frontend]
    if: |
      github.event_name != 'pull_request' ||
      (github.base_ref == 'a4i/staging' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: a11y-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/kind-tests.yaml
    secrets: inherit
    with:
      suite: accessibility
      mode: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}

  regression-tests:
    name: Regression Tests
    needs: [ci-api, ci-backend, ci-frontend]
    if: |
      github.event_name != 'pull_request' ||
      (github.base_ref == 'a4i/staging' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/kind-tests.yaml
    secrets: inherit
    with:
      suite: regression
      mode: ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }}

  integration-backend:
    name: Backend Integration Tests
    needs: [ci-api, ci-backend, ci-frontend]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/kind-tests.yaml
    secrets: inherit
    with:
      suite: integration

  performance-tests:
    name: Performance Tests
    needs: [ci-api, ci-backend, ci-frontend]
    if: |
      github.event_name != 'pull_request' ||
      (github.base_ref == 'a4i/staging' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/kind-tests.yaml
    secrets: inherit
    with:
      suite: performance
      mode: smoke

  # Nightly load test against the shared staging cluster, compared with the previous night.
  performance-nightly:
    name: Nightly Load Test
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@v1
      - uses: actions/cache/restore@v4
        with:
          path: k6_previous.json
          key: k6-nightly-none
          restore-keys: k6-nightly-
      - name: Load test
        env:
          FRONTEND_URL: ${{ vars.KUBE_STAGING_FRONTEND_URL }}
        run: k6 run --summary-export=k6_summary.json tests/performance/load_test.js
      - name: Compare p95 with the previous night
        run: |
          [ -f k6_previous.json ] || { echo "no previous run to compare"; exit 0; }
          now=$(jq '.metrics.http_req_duration["p(95)"]' k6_summary.json)
          before=$(jq '.metrics.http_req_duration["p(95)"]' k6_previous.json)
          echo "p95 now ${now}ms, previous ${before}ms"
          awk -v n="$now" -v b="$before" 'BEGIN { exit !(n > b * 1.5) }' && { echo "::error::p95 is more than 1.5x the previous night"; exit 1; } || true
      - run: cp k6_summary.json k6_previous.json
        if: success()
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: k6_previous.json
          key: k6-nightly-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-nightly-summary
          path: k6_summary.json

  notify-nightly:
    name: Notify nightly failure
    needs: [accessibility-tests, regression-tests, integration-backend, performance-tests, performance-nightly]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: Attention
          services: '[{"name":"Nightly tests","description":"Failed","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]'

  notify:
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'a4i/main' || github.ref_name == 'a4i/staging') }}
    needs: [ci-frontend, ci-api, ci-backend, health-check, cd-api-prod, cd-backend-prod, cd-frontend-prod, accessibility-tests, regression-tests, performance-tests, integration-backend]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Regression Report
        uses: actions/download-artifact@v4
        with: { name: regression-report, path: reports/regression }
        continue-on-error: true
      - name: Download k6 Summary
        uses: actions/download-artifact@v4
        with: { name: k6-summary, path: reports/performance }
        continue-on-error: true

      - name: Generate Status JSON
        id: status
        env:
          FE_RES: ${{ (github.ref_name == 'a4i/staging' && needs.ci-frontend.result) || needs.cd-frontend-prod.result }}
          API_RES: ${{ needs.cd-api-prod.result }}
          BE_RES: ${{ (github.ref_name == 'a4i/staging' && needs.ci-backend.result) || needs.cd-backend-prod.result }}
          FE_URL: ${{ (github.ref_name == 'a4i/staging' && vars.KUBE_STAGING_FRONTEND_URL) || needs.cd-frontend-prod.outputs.page_url }}
          API_URL: ${{ needs.cd-api-prod.outputs['service-url'] }}
          BE_URL: ${{ (github.ref_name == 'a4i/staging' && vars.KUBE_STAGING_FRONTEND_URL) || needs.cd-backend-prod.outputs['service-url'] }}
          E2E_RES: ${{ needs.integration-backend.result }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 <<EOF
          import os, json, csv

          def parse_pytest_csv(filepath):
              if not os.path.exists(filepath): return "Not Run"
              total, passed, failed = 0, 0, 0
              try:
                  with open(filepath, 'r') as f:
                      reader = csv.DictReader(f)
                      for row in reader:
                          total += 1
                          if row.get('status') == 'passed': passed += 1
                          elif row.get('status') == 'failed': failed += 1
              except: return "Error"
              if failed == 0 and total > 0: return "Pass"
              if failed > 0: return f"Fail ({failed}/{total})"
              return "Empty"

          def parse_k6_json(filepath):
              if not os.path.exists(filepath): return "Not Run"
              try:
                  with open(filepath, 'r') as f: data = json.load(f)
                  metrics = data.get('metrics', {})

                  req_dur = metrics.get('http_req_duration', {})
                  p95 = req_dur.get('values', {}).get('p(95)', req_dur.get('p(95)', 0))

                  req_fail = metrics.get('http_req_failed', {})
                  rate = req_fail.get('values', {}).get('rate', req_fail.get('rate', 0))

                  return f"p95: {p95:.0f}ms, Err: {rate*100:.1f}%"
              except: return "Error"

          fe_status = os.environ.get('FE_RES') == 'success'
          api_status = os.environ.get('API_RES') == 'success'
          be_status = os.environ.get('BE_RES') == 'success'
          e2e_res = os.environ.get('E2E_RES', 'skipped')
          e2e_desc = "Pass" if e2e_res == 'success' else ("Skipped" if e2e_res == 'skipped' else f"Status: {e2e_res}")

          def get_desc(status, res):
              if status: return "Deployed"
              if res == 'skipped': return "Skipped"
              return f"Status: {res}"

          fe_desc = get_desc(fe_status, os.environ.get('FE_RES'))
          api_desc = get_desc(api_status, os.environ.get('API_RES'))
          be_desc = get_desc(be_status, os.environ.get('BE_RES'))

          regr_desc = parse_pytest_csv('reports/regression/regression_report.csv')
          perf_desc = parse_k6_json('reports/performance/k6_summary.json')

          failures = [
             os.environ.get('FE_RES'), os.environ.get('API_RES'), os.environ.get('BE_RES'), e2e_res
          ]
          is_fail = 'failure' in failures or 'Fail' in regr_desc
          color = "Attention" if is_fail else "Good"
          services = [
              {"name": "Frontend", "description": fe_desc, "url": os.environ.get('FE_URL', '')},
              {"name": "API", "description": api_desc, "url": os.environ.get('API_URL', '')},
              {"name": "Backend", "description": be_desc, "url": os.environ.get('BE_URL', '')},
              {"name": "Regression", "description": regr_desc, "url": os.environ.get('RUN_URL')},
              {"name": "Performance", "description": perf_desc, "url": os.environ.get('RUN_URL')},
              {"name": "E2E Backend", "description": e2e_desc, "url": os.environ.get('RUN_URL')}
          ]
          # Staging api is cluster-internal only, so no API row on staging pushes
          if os.environ.get('GITHUB_REF_NAME') == 'a4i/staging':
              services = [s for s in services if s["name"] != "API"]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"heading_color={color}\n")
              f.write(f"services_json={json.dumps(services)}\n")
          EOF

      - name: Notify Teams
        uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: ${{ steps.status.outputs.heading_color }}
          services: ${{ steps.status.outputs.services_json }}
