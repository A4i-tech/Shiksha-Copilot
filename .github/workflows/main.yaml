# .github/workflows/main.yaml

name: CI

on:
  push:
    branches: [ "a4i/main", "a4i/staging" ]
  pull_request:
    branches: [ "a4i/main", "a4i/staging" ]
  workflow_dispatch:

jobs:
  cicd-frontend:
    uses: ./.github/workflows/cicd-frontend.yaml
    secrets: inherit
    with:
      deploy_name: shiksha-frontend-staging
      deploy: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}

  ci-api:
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-backend:
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  cd-api:
    needs: ci-api
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/cd-render.yaml
    with:
      deploy_name: shiksha-api-staging
      service_id: ${{ vars.RENDER_API_SERVICE_ID }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  cd-backend:
    needs: ci-backend
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/cd-render.yaml
    with:
      deploy_name: shiksha-backend-staging
      service_id: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [cicd-frontend, ci-api, ci-backend, cd-api, cd-backend]
    if: success() && github.event_name == 'push' && (github.ref_name == 'a4i/main' || github.ref_name == 'a4i/staging')
    steps:
      - name: Notify Teams Success
        run: |
          if [ -z "${MICROSOFT_TEAMS_WEBHOOK}" ]; then
            echo "No webhook configured, skipping notification."
            exit 0
          fi

          curl -H "Content-Type: application/json" \
               -d "$BODY" \
               "$MICROSOFT_TEAMS_WEBHOOK"
        env:
          MICROSOFT_TEAMS_WEBHOOK: ${{ secrets.MICROSOFT_TEAMS_WEBHOOK }}
          BODY: |
            {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Build Success",
              "themeColor": "00FF00",
              "title": "✅ Successful Build",
              "sections": [{
                "activityTitle": "[**A4i-tech/Shiksha-Copilot**](https://github.com/A4i-tech/Shiksha-Copilot)",
                "activitySubtitle": "${{ github.ref_name }}",
                "facts": [
                  { "name": "Commit", "value": "[`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" },
                  { "name": "Author", "value": "[${{ github.actor }}](https://github.com/${{ github.actor }})" },
                  { "name": "Time", "value": "${{ github.event.head_commit.timestamp }}" },
                  { "name": "GHCR", "value": "[ghcr.io/${{ github.repository }}](https://ghcr.io/${{ github.repository }})" }
                ],
                "markdown": true
              }],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "View Build Logs",
                  "targets": [
                    { "os": "default", "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }

  notify-failure:
    runs-on: ubuntu-latest
    needs: [cicd-frontend, ci-api, ci-backend, cd-api, cd-backend]
    if: failure() && github.event_name == 'push' && (github.ref_name == 'a4i/main' || github.ref_name == 'a4i/staging')
    steps:
      - name: Notify Teams Failure
        run: |
          if [ -z "${MICROSOFT_TEAMS_WEBHOOK}" ]; then
            echo "No webhook configured, skipping notification."
            exit 0
          fi

          curl -H "Content-Type: application/json" \
               -d "$BODY" \
               "$MICROSOFT_TEAMS_WEBHOOK"
        env:
          MICROSOFT_TEAMS_WEBHOOK: ${{ secrets.MICROSOFT_TEAMS_WEBHOOK }}
          BODY: |
            {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Build Failed",
              "themeColor": "FF0000",
              "title": "❌ Build Failed",
              "sections": [{
                "activityTitle": "[**A4i-tech/Shiksha-Copilot**](https://github.com/A4i-tech/Shiksha-Copilot)",
                "activitySubtitle": "${{ github.ref_name }}",
                "facts": [
                  { "name": "Commit", "value": "[`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" },
                  { "name": "Author", "value": "[${{ github.actor }}](https://github.com/${{ github.actor }})" },
                  { "name": "Time", "value": "${{ github.event.head_commit.timestamp }}" },
                  { "name": "GHCR", "value": "[ghcr.io/${{ github.repository }}](https://ghcr.io/${{ github.repository }})" }
                ],
                "markdown": true
              }],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "View Build Logs",
                  "targets": [
                    { "os": "default", "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
                  ]
                }
              ]
            }
