name: CI

on:
  push:
    branches: [ "a4i/main", "a4i/staging" ]
  pull_request:
    branches: [ "a4i/main", "a4i/staging" ]
  workflow_dispatch:

jobs:
  cicd-frontend:
    uses: ./.github/workflows/cicd-frontend.yaml
    secrets: inherit
    with:
      deploy_name: shiksha-frontend-staging
      deploy: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}

  ci-api:
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-backend:
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  cd-api:
    needs: ci-api
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/deploy-render.yaml
    with:
      deploy-name: shiksha-api-staging
      service-id: ${{ vars.RENDER_API_SERVICE_ID }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  cd-backend:
    needs: ci-backend
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/deploy-render.yaml
    with:
      deploy-name: shiksha-backend-staging
      service-id: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  notify:
    runs-on: ubuntu-latest
    needs: [cicd-frontend, ci-api, ci-backend, cd-api, cd-backend]
    if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'a4i/main' || github.ref_name == 'a4i/staging') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Teams (success)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'canceled') }}
        uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: Good
          services: |
            [
              {
                "name": "Frontend",
                "description": "${{ needs.cicd-frontend.result == 'success' && 'Built and deployed' || 'Not deployed' }}",
                "url": "${{ needs.cicd-frontend.outputs.page_url || '' }}"
              },
              {
                "name": "API",
                "description": "${{ needs.cd-api.result == 'success' && 'Built and deployed' || 'Not deployed' }}",
                "url": "${{ needs.cd-api.result == 'success' && needs.cd-api.outputs['service-url'] || '' }}"
              },
              {
                "name": "Backend",
                "description": "${{ needs.cd-backend.result == 'success' && 'Built and deployed' || 'Not deployed' }}",
                "url": "${{ needs.cd-backend.result == 'success' && needs.cd-backend.outputs['service-url'] || '' }}"
              }
            ]

      - name: Notify Teams (failure)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'canceled') }}
        uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: Attention
          services: |
            [
              {
                "name": "Frontend",
                "description": "${{ needs.cicd-frontend.result }}",
                "url": "${{ needs.cicd-frontend.outputs.page_url || '' }}"
              },
              {
                "name": "API",
                "description": "${{ needs.ci-api.result }} / deploy: ${{ needs.cd-api.result }}",
                "url": "${{ needs.cd-api.outputs['service-url'] || '' }}"
              },
              {
                "name": "Backend",
                "description": "${{ needs.ci-backend.result }} / deploy: ${{ needs.cd-backend.result }}",
                "url": "${{ needs.cd-backend.outputs['service-url'] || '' }}"
              }
            ]
