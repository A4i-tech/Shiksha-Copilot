name: CI

on:
  push:
    branches: [ "a4i/main", "a4i/staging"]
  pull_request:
    branches: [ "a4i/main", "a4i/staging" ]
  workflow_dispatch:

jobs:
  ci-api:
    uses: ./.github/workflows/ci-api.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-backend:
    uses: ./.github/workflows/ci-backend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}
      update_cov_badge: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yaml
    secrets: inherit
    with:
      publish_staging: ${{ github.event_name == 'push' && github.ref_name == 'a4i/staging' }}
      publish_latest: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' }}

  shiksha-coverage-summary:
    needs: [ci-api, ci-backend]
    if: always()
    uses: ./.github/workflows/shiksha-coverage-summary.yml
    secrets: inherit

  cd-api:
    needs: ci-api
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/deploy-render.yaml
    with:
      deploy-name: shiksha-api-staging
      service-id: ${{ vars.RENDER_API_SERVICE_ID }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  integration-api:
    name: API Integration Tests
    needs: [cicd-frontend, cd-api, health-check]
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: shiksha-api/app-service
        run: |
          pip install poetry
          poetry install
      - name: Run integration tests
        working-directory: shiksha-api/app-service
        env:
          SHIKSHA_BASE_URL: ${{ needs.cd-api.outputs['service-url'] }}
        run: poetry run pytest tests/integration -m integration --no-cov

  cd-backend:
    needs: ci-backend
    if: github.event_name == 'push' && github.ref_name == 'a4i/staging'
    uses: ./.github/workflows/deploy-render.yaml
    with:
      deploy-name: shiksha-backend-staging
      service-id: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  cicd-frontend:
    name: Deploy frontend
    needs: cd-backend
    if: always() && github.event_name == 'push' && github.ref_name == 'a4i/staging' && needs.cd-backend.result == 'success'
    uses: ./.github/workflows/cicd-frontend.yaml
    secrets: inherit
    with:
      deploy_name: shiksha-frontend-staging
      deploy_target: github-pages
      environment: uat
      api_url: ${{ format('{0}/api', needs.cd-backend.outputs['service-url']) }}
      turnstile_site_key: ${{ vars.TURNSTILE_SITE_KEY }}
      superset_url: ${{ vars.SUPERSET_URL }}
      superset_dashboard_uuid: ${{ vars.SUPERSET_DASHBOARD_UUID }}
      superset_mobile_dashboard_uuid: ${{ vars.SUPERSET_MOBILE_DASHBOARD_UUID }}

  cd-frontend-render:
    name: Deploy frontend preview (Render)
    if: |
      github.event_name == 'pull_request' && github.base_ref == 'a4i/staging' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # One shared preview service, and deploying repoints its branch. Serialise
    # across PRs so two runs can't repoint it while the other is still
    # deploying (last writer would otherwise win and the reported branch would
    # not match what is actually live).
    concurrency:
      group: render-frontend-preview
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-render.yaml
    with:
      deploy-name: shiksha-frontend-preview
      service-id: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
      branch: ${{ github.head_ref }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  cd-api-prod:
    name: Deploy api
    needs: ci-api
    if: github.event_name == 'push' && github.ref_name == 'a4i/main'
    uses: ./.github/workflows/deploy-azure-webapp.yml
    with:
      azure-webapp-name: ${{ vars.AZURE_WEBAPP_NAME_API }}
      image-tag: ${{ needs.ci-api.outputs['tag_primary'] }}
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}

  cd-backend-prod:
    name: Deploy backend
    needs: ci-backend
    if: github.event_name == 'push' && github.ref_name == 'a4i/main'
    uses: ./.github/workflows/deploy-azure-webapp.yml
    with:
      azure-webapp-name: ${{ vars.AZURE_WEBAPP_NAME_BACKEND }}
      image-tag: ${{ needs.ci-backend.outputs['tag_primary'] }}
    secrets:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}

  cd-frontend-prod:
    needs: cd-backend-prod
    uses: ./.github/workflows/cicd-frontend.yaml
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    with:
      deploy_name: shiksha-frontend-prod
      deploy_target: ${{ github.event_name == 'push' && github.ref_name == 'a4i/main' && 'azure-swa' || '' }}
      environment: production
      api_url: ${{ needs.cd-backend-prod.result == 'success' && format('{0}/api', needs.cd-backend-prod.outputs['service-url']) || '' }}
      turnstile_site_key: ${{ vars.TURNSTILE_SITE_KEY }}
      superset_url: ${{ vars.SUPERSET_URL }}
      superset_dashboard_uuid: ${{ vars.SUPERSET_DASHBOARD_UUID }}
      superset_mobile_dashboard_uuid: ${{ vars.SUPERSET_MOBILE_DASHBOARD_UUID }}

  health-check:
    name: Health Check
    needs: [cicd-frontend, cd-api, cd-backend, cd-frontend-prod, cd-api-prod, cd-backend-prod]
    if: |
      always() &&
      github.event_name == 'push' && ((
        github.ref_name == 'a4i/staging' &&
        needs.cicd-frontend.result == 'success' &&
        needs.cd-api.result == 'success' &&
        needs.cd-backend.result == 'success'
      ) || (
        github.ref_name == 'a4i/main' &&
        needs.cd-frontend-prod.result == 'success' &&
        needs.cd-api-prod.result == 'success' &&
        needs.cd-backend-prod.result == 'success'
      ))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve URLs
        id: urls
        run: |
          if [ "${{ github.ref_name }}" = "a4i/staging" ]; then
            echo "frontend=${{ needs.cicd-frontend.outputs.page_url }}" >> $GITHUB_OUTPUT
            echo "backend=${{ needs.cd-backend.outputs['service-url'] }}" >> $GITHUB_OUTPUT
            echo "api=${{ needs.cd-api.outputs['service-url'] }}" >> $GITHUB_OUTPUT
          else
            echo "frontend=${{ needs.cd-frontend-prod.outputs.page_url }}" >> $GITHUB_OUTPUT
            echo "backend=${{ needs.cd-backend-prod.outputs['service-url'] }}" >> $GITHUB_OUTPUT
            echo "api=${{ needs.cd-api-prod.outputs['service-url'] }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify Services
        env:
          EXPECTED_BUILD: ${{ github.sha }}
          FRONTEND_URL: ${{ steps.urls.outputs.frontend }}
          BACKEND_URL: ${{ steps.urls.outputs.backend }}
          API_URL: ${{ steps.urls.outputs.api }}
        run: |
          trap 'echo "Cancelled"; exit 1' TERM INT

          check_build() {
            local name=$1 url=$2
            local build=$(curl -sf --max-time 30 "$url" | jq -r '.build // empty')
            if [ "$build" = "$EXPECTED_BUILD" ]; then
              echo "PASS $name on correct build"
              return 0
            else
              echo "FAIL $name build mismatch (got: '${build:-no response}', expected: '$EXPECTED_BUILD')"
              return 1
            fi
          }

          for ((i=1; i<=30; i++)); do
            echo "--- Attempt $i/30 ---"
            check_build "Frontend" "$FRONTEND_URL/health.json" && \
            check_build "Backend"  "$BACKEND_URL/health"      && \
            check_build "API"      "$BACKEND_URL/health-api"  && \
            { echo "All services on build $EXPECTED_BUILD"; exit 0; }
            sleep 15 & wait $!
          done

          echo "Timed out waiting for build $EXPECTED_BUILD"
          exit 1

  smoke-tests:
    name: Smoke Tests
    needs: [cicd-frontend, cd-api, health-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          playwright install chromium
      - name: Run Smoke Tests
        env:
          FRONTEND_URL: ${{ needs.cicd-frontend.outputs.page_url }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
        run: pytest tests/smoke --csv smoke_report.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: smoke_report.csv

  regression-tests:
    name: Regression Tests
    needs: [cicd-frontend, cd-api, health-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.11' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          playwright install chromium
      - name: Run Regression Tests
        env:
          FRONTEND_URL: ${{ needs.cicd-frontend.outputs.page_url }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
        run: pytest tests/regression --csv regression_report.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: regression_report.csv

  performance-tests:
    name: Performance Tests
    needs: [cicd-frontend, cd-api, health-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.0
        env:
          FRONTEND_URL: ${{ needs.cicd-frontend.outputs.page_url }}/#/auth/signin
        with:
          filename: tests/performance/load_test.js
          flags: --summary-export=k6_summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summary
          path: k6_summary.json

  accessibility-tests:
    name: Accessibility Tests
    needs: [cd-frontend-render, health-check]
    if: |
      always() &&
      github.event_name == 'pull_request' && github.base_ref == 'a4i/staging' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.cd-frontend-render.result == 'success' &&
      (needs.health-check.result == 'success' || needs.health-check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --prefix tests/accessibility

      - name: Install Playwright browsers
        run: npx --prefix tests/accessibility playwright install chromium --with-deps

      # PR previews hit the pre-existing staging api/backend (cd-api/cd-backend
      # don't run for PRs); a Render cold-start can outlast the scanner's login
      # timeouts, so resolve their URLs and ping them awake before the scan.
      - name: Warm up backend + api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          AUTH="Authorization: Bearer $RENDER_API_KEY"
          get_service_url() {
            curl -fsS -H "$AUTH" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$1" | jq -r '.serviceDetails.url'
          }
          BACKEND_URL=$(get_service_url "${{ vars.RENDER_BACKEND_SERVICE_ID }}")
          API_URL=$(get_service_url "${{ vars.RENDER_API_SERVICE_ID }}")
          echo "Backend: $BACKEND_URL"
          echo "API: $API_URL"

          for ((i=1; i<=30; i++)); do
            echo "--- Ping attempt $i/30 ---"
            curl -sf --max-time 30 "$BACKEND_URL/health" >/dev/null && \
            curl -sf --max-time 30 "$API_URL/health" >/dev/null && \
            { echo "Backend + API awake"; break; }
            sleep 15 & wait $!
          done

          if [ $i -gt 30 ]; then
            echo "Services did not respond in time"
            exit 1
          fi

      # deploy-render.yaml already waits for the Render deploy to hit "live",
      # but the static site can lag behind that briefly; poll for HTTP 200
      # before running tests as a safety net.
      - name: Wait for frontend deployment
        env:
          FRONTEND_URL: ${{ needs.cd-frontend-render.outputs['service-url'] }}
        run: |
          echo "Waiting for $FRONTEND_URL to become reachable..."
          for ((i=1; i<=40; i++)); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$FRONTEND_URL") || true
            echo "  Attempt $i/40: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Frontend is live!"
              exit 0
            fi
            sleep 15 & wait $!
          done
          echo "Frontend at $FRONTEND_URL did not become reachable (last status: $status)"
          exit 1

      # Fails the job (and so the PR check) on any critical violation, any page
      # below the score threshold, or any page that could not be scanned.
      - name: Run Accessibility Tests
        id: a11y
        env:
          FRONTEND_URL: ${{ needs.cd-frontend-render.outputs['service-url'] }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
          TEST_ADMIN_PHONE: ${{ secrets.TEST_ADMIN_PHONE }}
          TEST_ADMIN_OTP: ${{ secrets.TEST_ADMIN_OTP }}
        run: node tests/accessibility/run-accessibility.js

      - name: Upload accessibility report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: tests/accessibility/results/

      # Posted as a PR comment because the HTML dashboard is only reachable as a
      # zip via the artifact URL, and nobody hunts for that.
      #
      # Editing the existing comment would pin it to the position it was first
      # posted at, which is near the top of a long-running PR. Delete the old
      # one and post fresh instead, so the report always sits at the bottom of
      # the conversation next to the checks.
      - name: Comment report on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=tests/accessibility/results/summary.md
          if [ ! -f "$BODY" ]; then
            # Scanner died before writing a summary (login failure, timeout, …).
            mkdir -p "$(dirname "$BODY")"
            printf '## Accessibility (axe-core, WCAG 2.1 AA)\n\n**Scan did not complete** — see the workflow log.\n' > "$BODY"
          fi
          {
            echo
            # Upload can be skipped or fail; an empty URL would render a dead link.
            if [ -n "${ARTIFACT_URL:-}" ]; then
              echo "[Download the full HTML report]($ARTIFACT_URL) — unzip and open \`accessibility-report-*.html\`."
            else
              echo "_Report artifact was not uploaded — see the workflow log._"
            fi
            echo
            echo "<sub>a11y-report</sub>"
          } >> "$BODY"

          # <sub>a11y-report</sub> marks our own comments so we only delete those.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select(.body | contains("<sub>a11y-report</sub>")) | .id' \
            | while read -r id; do
                echo "Removing previous report comment $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
              done

          gh pr comment "$PR_NUMBER" --body-file "$BODY"

  notify:
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && (github.ref_name == 'a4i/main' || github.ref_name == 'a4i/staging') }}
    needs: [cicd-frontend, ci-api, ci-backend, cd-api, cd-backend, cd-api-prod, cd-backend-prod, cd-frontend-prod, integration-api, smoke-tests, regression-tests, performance-tests, accessibility-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Smoke Report
        uses: actions/download-artifact@v4
        with: { name: smoke-report, path: reports/smoke }
        continue-on-error: true
      - name: Download Regression Report
        uses: actions/download-artifact@v4
        with: { name: regression-report, path: reports/regression }
        continue-on-error: true
      - name: Download k6 Summary
        uses: actions/download-artifact@v4
        with: { name: k6-summary, path: reports/performance }
        continue-on-error: true

      - name: Generate Status JSON
        id: status
        env:
          FE_RES: ${{ (needs.cicd-frontend.result != 'skipped' && needs.cicd-frontend.result) || needs.cd-frontend-prod.result }}
          API_RES: ${{ (needs.cd-api.result != 'skipped' && needs.cd-api.result) || needs.cd-api-prod.result }}
          BE_RES: ${{ (needs.cd-backend.result != 'skipped' && needs.cd-backend.result) || needs.cd-backend-prod.result }}
          FE_URL: ${{ needs.cicd-frontend.outputs.page_url || needs.cd-frontend-prod.outputs.page_url }}
          API_URL: ${{ needs.cd-api.outputs['service-url'] || needs.cd-api-prod.outputs['service-url'] }}
          BE_URL: ${{ needs.cd-backend.outputs['service-url'] || needs.cd-backend-prod.outputs['service-url'] }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 <<EOF
          import os, json, csv

          def parse_pytest_csv(filepath):
              if not os.path.exists(filepath): return "Not Run"
              total, passed, failed = 0, 0, 0
              try:
                  with open(filepath, 'r') as f:
                      reader = csv.DictReader(f)
                      for row in reader:
                          total += 1
                          if row.get('status') == 'passed': passed += 1
                          elif row.get('status') == 'failed': failed += 1
              except: return "Error"
              if failed == 0 and total > 0: return "Pass"
              if failed > 0: return f"Fail ({failed}/{total})"
              return "Empty"

          def parse_k6_json(filepath):
              if not os.path.exists(filepath): return "Not Run"
              try:
                  with open(filepath, 'r') as f: data = json.load(f)
                  metrics = data.get('metrics', {})

                  req_dur = metrics.get('http_req_duration', {})
                  p95 = req_dur.get('values', {}).get('p(95)', req_dur.get('p(95)', 0))

                  req_fail = metrics.get('http_req_failed', {})
                  rate = req_fail.get('values', {}).get('rate', req_fail.get('rate', 0))

                  return f"p95: {p95:.0f}ms, Err: {rate*100:.1f}%"
              except: return "Error"

          fe_status = os.environ.get('FE_RES') == 'success'
          api_status = os.environ.get('API_RES') == 'success'
          be_status = os.environ.get('BE_RES') == 'success'

          def get_desc(status, res):
              if status: return "Deployed"
              if res == 'skipped': return "Skipped"
              return f"Status: {res}"

          fe_desc = get_desc(fe_status, os.environ.get('FE_RES'))
          api_desc = get_desc(api_status, os.environ.get('API_RES'))
          be_desc = get_desc(be_status, os.environ.get('BE_RES'))

          smoke_desc = parse_pytest_csv('reports/smoke/smoke_report.csv')
          regr_desc = parse_pytest_csv('reports/regression/regression_report.csv')
          perf_desc = parse_k6_json('reports/performance/k6_summary.json')

          failures = [
             os.environ.get('FE_RES'), os.environ.get('API_RES'), os.environ.get('BE_RES')
          ]
          is_fail = 'failure' in failures or 'Fail' in smoke_desc or 'Fail' in regr_desc
          color = "Attention" if is_fail else "Good"
          services = [
              {"name": "Frontend", "description": fe_desc, "url": os.environ.get('FE_URL', '')},
              {"name": "API", "description": api_desc, "url": os.environ.get('API_URL', '')},
              {"name": "Backend", "description": be_desc, "url": os.environ.get('BE_URL', '')},
              {"name": "Smoke Tests", "description": smoke_desc, "url": os.environ.get('RUN_URL')},
              {"name": "Regression", "description": regr_desc, "url": os.environ.get('RUN_URL')},
              {"name": "Performance", "description": perf_desc, "url": os.environ.get('RUN_URL')}
          ]

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"heading_color={color}\n")
              f.write(f"services_json={json.dumps(services)}\n")
          EOF

      - name: Notify Teams
        uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: ${{ steps.status.outputs.heading_color }}
          services: ${{ steps.status.outputs.services_json }}
