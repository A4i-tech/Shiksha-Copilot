# Temporary branch trial workflow. Delete before merge.
name: QP tests (branch trial)

on:
  push:
    branches: ["pun-it/747-qp-regression-tests"]

jobs:
  regression-ui:
    name: Regression UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run regression tests
        env:
          FRONTEND_URL: ${{ vars.KUBE_STAGING_FRONTEND_URL }}
          BACKEND_URL: ${{ vars.KUBE_STAGING_FRONTEND_URL }}/api
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
        run: pytest regression --csv regression_report.csv --csv-columns id status duration
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: tests/regression_report.csv
          if-no-files-found: warn
