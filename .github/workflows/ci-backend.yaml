name: CI Backend

on:
  workflow_call:
    inputs:
      publish_staging:
        description: "Whether to set 'staging' tag on published image"
        required: true
        type: boolean
      publish_latest:
        description: "Whether to set 'latest' tag on published image"
        required: true
        type: boolean
      update_cov_badge:
        description: "Whether to update Code Coverage Badge"
        required: true
        type: boolean
    outputs:
      coverage_percentage:
        description: "Backend coverage percentage"
        value: ${{ jobs.build-test.outputs.coverage_percentage }}
      digest:
        description: "Pushed backend image digest"
        value: ${{ jobs.push.outputs.digest }}
      tags:
        description: "Pushed image tags"
        value: ${{ jobs.build-test.outputs.image_tags }}
      tag_primary:
        description: "Pushed image tag (primary)"
        value: ${{ jobs.build-test.outputs.image_tag_primary }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      E2E_PORT: 8080
      E2E_LLM_STUB_PORT: 4010
      E2E_MONGO_URL: mongodb://127.0.0.1:27017/shiksha_e2e
      E2E_JWT_SECRET: e2e-test-jwt-secret
      E2E_JWT_SECRET_REMEMBER_ME: e2e-test-remember-secret
      E2E_PIN_SECRET_KEY: e2e-test-pin-secret
    outputs:
      coverage_percentage: ${{ steps.extract_backend_coverage.outputs.percentage }}
      image_tag_primary: ${{ steps.set_tag_primary.outputs.image_tag_primary }}
      image_tags: ${{ steps.backend_meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run unit tests (before build)
        working-directory: shiksha-website/shiksha-backend
        run: |
          npm ci
          npm run test:unit:coverage
          # Save unit test coverage to a separate directory
          mkdir -p ../coverage-unit
          cp -r coverage/* ../coverage-unit/ || true

      - name: Start LLM stub server
        working-directory: shiksha-website/shiksha-backend
        env:
          LLM_STUB_PORT: ${{ env.E2E_LLM_STUB_PORT }}
        run: |
          node __tests__/e2e/llm-stub-server.js &
          echo $! > /tmp/llm-stub.pid

      - name: Start live backend instance for E2E tests
        working-directory: shiksha-website/shiksha-backend
        env:
          NODE_ENV: development
          PORT: ${{ env.E2E_PORT }}
          MONGO_URL: ${{ env.E2E_MONGO_URL }}
          JWT_SECRET: ${{ env.E2E_JWT_SECRET }}
          JWT_SECRET_REMEMBER_ME: ${{ env.E2E_JWT_SECRET_REMEMBER_ME }}
          PIN_SECRET_KEY: ${{ env.E2E_PIN_SECRET_KEY }}
          LLM_API_BASE_URL: http://127.0.0.1:${{ env.E2E_LLM_STUB_PORT }}
          LLM_WORKFLOW_URL: http://127.0.0.1:${{ env.E2E_LLM_STUB_PORT }}
          LLM_CHECKLIST_URL: http://127.0.0.1:${{ env.E2E_LLM_STUB_PORT }}/checklist
        run: |
          # The mongodb service container above is already running, so
          # dbService.connect() (called at app.js module scope) has
          # something to connect to as soon as this starts.
          node app.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${{ env.E2E_PORT }}/health" > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy in time"
          cat /tmp/backend.log
          exit 1

      - name: Run integration (E2E) tests against the live instance
        working-directory: shiksha-website/shiksha-backend
        env:
          NODE_ENV: development
          CI: true
          SHIKSHA_BASE_URL: http://127.0.0.1:${{ env.E2E_PORT }}
          MONGO_URL: ${{ env.E2E_MONGO_URL }}
          JWT_SECRET: ${{ env.E2E_JWT_SECRET }}
          PIN_SECRET_KEY: ${{ env.E2E_PIN_SECRET_KEY }}
        run: |
          npm run test:integration:coverage
          mkdir -p ../coverage-integration
          cp -r coverage/* ../coverage-integration/ || true

      - name: Stop live backend and LLM stub
        if: always()
        run: |
          kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/llm-stub.pid)" 2>/dev/null || true

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=staging,enable=${{ inputs.publish_staging }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}

      - name: Set image name and tag output
        id: set_tag_primary
        run: |
          IMAGE_NAME=$(echo '${{ env.BACKEND_IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "image_tag_primary=${{ env.REGISTRY }}/$IMAGE_NAME:$(echo '${{ steps.backend_meta.outputs.tags }}' | tr ',' '\n' | grep ':sha-' | head -1 | cut -d: -f2)" >> $GITHUB_OUTPUT

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: shiksha-website/shiksha-backend
          file: shiksha-website/shiksha-backend/Dockerfile
          push: false
          tags: shiksha-backend-local
          load: true
          build-args: SHIKSHA_COPILOT_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Merge coverage reports
        working-directory: shiksha-website/shiksha-backend
        run: |
          npm ci
          # Merge unit and integration coverage using nyc
          npx nyc merge ../coverage-unit coverage-unit.json || echo '{}' > coverage-unit.json
          npx nyc merge coverage-integration coverage-integration.json || echo '{}' > coverage-integration.json
          mkdir -p coverage
          # Run all tests to generate combined coverage
          npm run test:coverage -- --passWithNoTests || true
          # Use the combined coverage for reporting
          cp coverage/coverage-summary.json coverage-summary.json 2>/dev/null || echo '{"total":{"statements":{"pct":0}}}' > coverage-summary.json

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shiksha-backend
          path: |
            shiksha-website/shiksha-backend/coverage
            shiksha-website/shiksha-backend/coverage-summary.json

      - name: Extract backend coverage percentage
        id: extract_backend_coverage
        run: |
          COVERAGE=$(jq -r '.total.statements.pct // 0' shiksha-website/shiksha-backend/coverage-summary.json | awk '{print int($1+0.999)}')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE%"

      - name: Create backend coverage badge
        if: inputs.update_cov_badge && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: backend.json
          label: coverage (backend)
          message: ${{ steps.extract_backend_coverage.outputs.percentage }}%
          color: ${{ steps.extract_backend_coverage.outputs.percentage > 80 && 'brightgreen' || steps.extract_backend_coverage.outputs.percentage > 60 && 'yellow' || 'red' }}

  push:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ needs.build-test.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: shiksha-website/shiksha-backend
          file: shiksha-website/shiksha-backend/Dockerfile
          push: true
          tags: ${{ needs.build-test.outputs.image_tags }}
          build-args: SHIKSHA_COPILOT_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
