name: CI Backend

on:
  workflow_call:
    outputs:
      coverage_percentage:
        description: "Backend coverage percentage"
        value: ${{ jobs.build-test.outputs.coverage_percentage }}
      digest:
        description: "Pushed backend image digest"
        value: ${{ jobs.push.outputs.digest }}
      tag:
        description: "Pushed backend image tag"
        value: ${{ jobs.build-test.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      coverage_percentage: ${{ steps.extract_backend_coverage.outputs.percentage }}
      image_tag: ${{ steps.backend_meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Extract backend metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: shiksha-website/shiksha-backend
          file: shiksha-website/shiksha-backend/Dockerfile
          build-args: |
            ALLOW_ORIGIN=${{ vars.BACKEND_ALLOW_ORIGIN }}
          push: false
          tags: shiksha-backend-local
          load: true
          cache-from: type=gha

      - name: Run backend tests inside built image
        run: |
          IMAGE=shiksha-backend-local
          mkdir -p shiksha-website/shiksha-backend/coverage
          touch shiksha-website/shiksha-backend/coverage/coverage-summary.json
          docker run --rm \
            -e NODE_ENV=development \
            -e CI=true \
            -v $PWD/shiksha-website/shiksha-backend/coverage:/usr/src/app/coverage \
            --workdir /usr/src/app \
            --entrypoint sh "$IMAGE" -c "npm ci && npm run test:coverage -- --passWithNoTests"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shiksha-backend
          path: shiksha-website/shiksha-backend/coverage

      - name: Extract backend coverage percentage
        id: extract_backend_coverage
        run: |
          COVERAGE=$(jq -r '.total.statements.pct // 0' shiksha-website/shiksha-backend/coverage/coverage-summary.json | awk '{print int($1+0.999)}')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE%"

      - name: Create backend coverage badge
        if: vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: backend.json
          label: coverage (backend)
          message: ${{ steps.extract_backend_coverage.outputs.percentage }}%
          color: ${{ steps.extract_backend_coverage.outputs.percentage > 80 && 'brightgreen' || steps.extract_backend_coverage.outputs.percentage > 60 && 'yellow' || 'red' }}

  push:
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ needs.build-test.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: shiksha-website/shiksha-backend
          file: shiksha-website/shiksha-backend/Dockerfile
          build-args: |
            ALLOW_ORIGIN=${{ vars.BACKEND_ALLOW_ORIGIN }}
          push: true
          tags: ${{ needs.build-test.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
