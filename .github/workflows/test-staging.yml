name: Run Tests

on:
  push:
    branches: [ "a4i/staging", "101-testing"] 
  workflow_dispatch:

jobs:
  health-check:
    name: Wait and Verify Deployment
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait and Verify Services
        run: |
          echo "Initial wait: Sleeping for 2 minutes..."
          sleep 5

          RETRIES=10
          SLEEP_TIME=15
          
          # Arrays for URLs and Names
          URLS=("${{ secrets.STAGING_URL }}" "${{ secrets.STAGING_BACKEND_URL }}" "${{ secrets.STAGING_API_URL }}")
          NAMES=("Frontend" "Backend" "API")

          for ((i=1; i<=RETRIES; i++)); do
            echo "Attempt $i of $RETRIES..."
            ALL_PASSED=true
            
            # Check all URLs in this attempt
            for ((j=0; j<${#URLS[@]}; j++)); do
              url="${URLS[$j]}"
              name="${NAMES[$j]}"
              echo "Checking $name ($url)..."
              if ! curl -f -I --max-time 30 "$url"; then
                echo "❌ $name is unresponsive."
                ALL_PASSED=false
              else
                echo "✅ $name is up."
              fi
            done

            if $ALL_PASSED; then
              echo "🎉 All services are up!"
              exit 0
            fi

            if [ $i -lt $RETRIES ]; then
              echo "⚠️ Some services are down. Sleeping for ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
            else
              echo "❌ Failed to verify all services after $RETRIES attempts."
              exit 1
            fi
          done

  smoke-tests:
    name: Smoke Tests
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Smoke Tests
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
        run: |
          pytest tests/smoke --csv smoke_report.csv

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke_report.csv

  regression-tests:
    name: Regression Tests
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Regression Tests
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
          TEST_USER_OTP: ${{ secrets.TEST_USER_OTP }}
        run: |
          pytest tests/regression --csv regression_report.csv

      - name: Upload Regression Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: regression_report.csv

  performance-tests:
    name: Performance Tests
    needs: health-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.0
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}/#/auth/signin
        with:
          filename: tests/performance/load_test.js
          flags: --summary-export=k6_summary.json

      - name: Upload k6 Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6_summary.json

  notify-report:
    name: Generate Report and Notify
    if: always() # Run even if tests fail
    needs: [smoke-tests, regression-tests, performance-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Smoke Report
        uses: actions/download-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke
        continue-on-error: true

      - name: Download Regression Report
        uses: actions/download-artifact@v4
        with:
          name: regression-report
          path: reports/regression
        continue-on-error: true

      - name: Download k6 Summary
        uses: actions/download-artifact@v4
        with:
          name: k6-summary
          path: reports/performance
        continue-on-error: true

      - name: Process Test Results
        id: results
        run: |
          python3 <<EOF
          import os, json, csv
          
          def parse_pytest_csv(filepath):
              if not os.path.exists(filepath):
                  return "Missing", 0, 0, 0
              total, passed, failed = 0, 0, 0
              try:
                  with open(filepath, 'r') as f:
                      reader = csv.DictReader(f)
                      for row in reader:
                          total += 1
                          if row.get('status') == 'passed': passed += 1
                          elif row.get('status') == 'failed': failed += 1
              except: pass
              status = "Pass" if failed == 0 and total > 0 else "Fail"
              return status, total, passed, failed

          def parse_k6_json(filepath):
              if not os.path.exists(filepath):
                  return "Missing", "N/A", "N/A"
              try:
                  with open(filepath, 'r') as f:
                      data = json.load(f)
                  
                  req_dur = data.get('metrics', {}).get('http_req_duration', {}).get('values', {}).get('p(95)', 'N/A')
                  failed_rate = data.get('metrics', {}).get('http_req_failed', {}).get('values', {}).get('rate', 'N/A')
                  
                  thresholds = data.get('metrics', {})
                  all_passed = True
                  
                  if 'http_req_duration' in thresholds:
                      threshold_result = thresholds['http_req_duration'].get('thresholds', {})
                      for threshold_name, threshold_data in threshold_result.items():
                          if not threshold_data.get('ok', True):
                              all_passed = False
                  
                  if 'http_req_failed' in thresholds:
                      threshold_result = thresholds['http_req_failed'].get('thresholds', {})
                      for threshold_name, threshold_data in threshold_result.items():
                          if not threshold_data.get('ok', True):
                              all_passed = False
                  
                  status = "Pass" if all_passed else "Fail"
                  
                  if isinstance(failed_rate, float): failed_rate = f"{failed_rate*100:.2f}%"
                  if isinstance(req_dur, float): req_dur = f"{req_dur:.2f}ms"
                  
                  return status, req_dur, failed_rate
              except:
                  return "Error", "N/A", "N/A"

          smoke_status, smoke_total, smoke_passed, smoke_failed = parse_pytest_csv('reports/smoke/smoke_report.csv')
          regr_status, regr_total, regr_passed, regr_failed = parse_pytest_csv('reports/regression/regression_report.csv')
          perf_status, p95, fail_rate = parse_k6_json('reports/performance/k6_summary.json')
          
          overall_status = "Good" if smoke_status == "Pass" and regr_status == "Pass" else "Attention"
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"smoke_desc={smoke_status}\n")
              f.write(f"regr_desc={regr_status}\n")
              f.write(f"perf_desc={perf_status}\n")
              f.write(f"heading_color={overall_status}\n")
          EOF

      - name: Notify Teams
        uses: ./.github/actions/dispatch-teams-workflow
        with:
          workflow-url: ${{ secrets.TEAMS_WORKFLOW_URL }}
          heading-color: ${{ steps.results.outputs.heading_color }}
          services: |
            [
              {
                "name": "Smoke Tests",
                "description": "${{ steps.results.outputs.smoke_desc }}",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              {
                "name": "Regression Tests",
                "description": "${{ steps.results.outputs.regr_desc }}",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              {
                "name": "Performance Tests",
                "description": "${{ steps.results.outputs.perf_desc }}",
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
