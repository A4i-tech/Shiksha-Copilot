name: CI API

on:
  workflow_call:
    inputs:
      publish_staging:
        description: "Whether to set 'staging' tag on published image"
        required: true
        type: boolean
      publish_latest:
        description: "Whether to set 'latest' tag on published image"
        required: true
        type: boolean
      publish_uat:
        description: "Whether to set 'release' tag on published image"
        required: false
        type: boolean
        default: false
      update_cov_badge:
        description: "Whether to update Code Coverage Badge"
        required: true
        type: boolean
    outputs:
      digest:
        description: "Pushed image digest"
        value: ${{ jobs.push.outputs.digest }}
      tags:
        description: "Pushed image tags"
        value: ${{ jobs.build-test.outputs.image_tags }}
      tag_primary:
        description: "Pushed image tag (primary)"
        value: ${{ jobs.build-test.outputs.image_tag_primary }}

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}/api

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag_primary: ${{ steps.set_tag_primary.outputs.image_tag_primary }}
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Run unit tests (before build)
        working-directory: shiksha-api/app-service
        env:
          OPENAI_API_KEY: dummy-key-for-testing
          BLOB_STORE_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=dummyaccount;AccountKey=dummykey;EndpointSuffix=core.windows.net
          QDRANT_URL: http://localhost:6333
          QDRANT_API_KEY: dummy-qdrant-key
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry install
          poetry run pytest tests/unit/ --cov=app --cov-report=html --cov-report=xml:coverage-unit.xml --cov-report json:coverage-unit.json
          # Save unit test coverage data
          cp .coverage .coverage.unit || true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=staging,enable=${{ inputs.publish_staging }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}
            type=raw,value=release,enable=${{ inputs.publish_uat }}

      - name: Set image name and tag output
        id: set_tag_primary
        run: |
          IMAGE_NAME=$(echo '${{ env.API_IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')
          echo "API_IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "image_tag_primary=${{ env.REGISTRY }}/$IMAGE_NAME:$(echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | grep ':sha-' | head -1 | cut -d: -f2)" >> $GITHUB_OUTPUT

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: shiksha-api/app-service/Dockerfile
          push: false
          tags: shiksha-api-local
          load: true
          build-args: SHIKSHA_COPILOT_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=shiksha-api
          cache-to: type=gha,scope=shiksha-api,mode=max

      - name: Run integration tests inside built image
        run: |
          IMAGE=shiksha-api-local
          mkdir -p htmlcov-integration
          mkdir -p shiksha-api/app-service
          # Create container, run tests, and copy coverage file out
          CONTAINER_ID=$(docker create \
            --entrypoint poetry "$IMAGE" run pytest tests/integration/ --cov=app --cov-report=html --cov-report=xml:coverage.xml --cov-report json:coverage.json)
          docker start -a $CONTAINER_ID || true
          docker cp $CONTAINER_ID:/src/app-service/.coverage shiksha-api/app-service/.coverage.integration || true
          docker cp $CONTAINER_ID:/src/app-service/htmlcov/. htmlcov-integration/ || true
          docker cp $CONTAINER_ID:/src/app-service/coverage.json shiksha-api/app-service/coverage-integration.json || true
          docker rm $CONTAINER_ID
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Combine coverage reports
        working-directory: shiksha-api/app-service
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Combine unit and integration coverage
          poetry run coverage combine .coverage.unit .coverage.integration 2>/dev/null || poetry run coverage combine .coverage.unit || true
          # Generate combined reports
          poetry run coverage json -o coverage.json
          poetry run coverage html -d ../../htmlcov
          poetry run coverage xml -o coverage.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shiksha-api-app-service
          path: |
            htmlcov
            shiksha-api/app-service/coverage.json
            shiksha-api/app-service/coverage.xml

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered' shiksha-api/app-service/coverage.json | awk '{print int($1+0.999)}')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Create coverage badge
        if: inputs.update_cov_badge && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: api.json
          label: coverage (api)
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.percentage > 80 && 'brightgreen' || steps.coverage.outputs.percentage > 60 && 'yellow' || 'red' }}

  push:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/a4i/main' || github.ref == 'refs/heads/a4i/staging' || github.ref == 'refs/heads/a4i/release' || github.ref == 'refs/heads/feature/uat-docker-deploy'
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ needs.build-test.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: shiksha-api/app-service/Dockerfile
          push: true
          tags: ${{ needs.build-test.outputs.image_tags }}
          build-args: SHIKSHA_COPILOT_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=shiksha-api
          cache-to: type=gha,scope=shiksha-api,mode=max
