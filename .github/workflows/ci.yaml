name: CI

on:
  workflow_call:
    outputs:
      digest:
        description: "Pushed image digest"
        value: ${{ jobs.push.outputs.digest }}
      tag:
        description: "Pushed image tag"
        value: ${{ jobs.build-test.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shiksha-api-local
          load: true
          cache-from: type=gha

      - name: Run tests inside built image
        run: |
          IMAGE=shiksha-api-local
          mkdir -p htmlcov
          touch coverage.json
          docker run --rm \
            -v $PWD/htmlcov:/src/app-service/htmlcov \
            -v $PWD/coverage.json:/src/app-service/coverage.json \
            --entrypoint poetry "$IMAGE" run pytest
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-shiksha-api-app-service
          path: htmlcov

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(jq -r '.totals.percent_covered' coverage.json | awk '{print int($1+0.999)}')
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Create coverage badge
        if: github.ref_name == github.event.repository.default_branch && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.COVERAGE_GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: api.json
          label: coverage (api)
          message: ${{ steps.coverage.outputs.percentage }}%
          color: ${{ steps.coverage.outputs.percentage > 80 && 'brightgreen' || steps.coverage.outputs.percentage > 60 && 'yellow' || 'red' }}

  push:
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ needs.build-test.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.build-test.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max