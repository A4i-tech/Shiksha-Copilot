name: CI

on:
  workflow_call:
    outputs:
      digest:
        description: "Pushed image digest"
        value: ${{ jobs.push.outputs.digest }}
      tag:
        description: "Pushed image tag"
        value: ${{ jobs.build-test.outputs.image_tag }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside built image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep "sha-" | head -n 1)
          mkdir -p htmlcov
          docker run --rm \
            -w /src/app-service \
            -v $PWD/htmlcov:/src/app-service/htmlcov \
            --entrypoint poetry "$IMAGE" run pytest
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-shiksha-api-app-service
          path: htmlcov

  push:
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ needs.build-test.outputs.image_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ needs.build-test.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
