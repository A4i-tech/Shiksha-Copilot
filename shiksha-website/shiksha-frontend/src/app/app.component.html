<div role="region" aria-label="Skip navigation and loading status">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-white focus:border focus:border-primary focus:rounded focus:shadow-lg">
    Skip to main content
  </a>
  <ngx-spinner
    data-testid="loading-spinner"
    bdColor="rgba(255, 255, 255, 0.92)"
    size="medium"
    color="#46A0F1"
    type="ball-scale-multiple"
  >
    <p class="text-black text-sm" style="color: #1f2937">{{ (loaderMessage.message$ | async) ?? '' | translate }}</p>
  </ngx-spinner>
</div>
<router-outlet></router-outlet>

<app-delete-detail
  *ngIf="showIdleWarning"
  [config]="{
    heading: 'Idle Time',
    confirmationText: 'idle message',
    primaryButtonLabel: 'Continue',
    primaryButtonType: 'logout',
    idleTime:idleTime
  }"
  [showCancelBtn]="false"
  (close)="closeModal($event)"
></app-delete-detail>
