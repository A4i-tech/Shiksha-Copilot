<ng-container *ngIf="key !== 'id'">
  <ng-container *ngIf="isText">
    <h4 *ngIf="isFixedText" class="mt-2 text-sm font-semibold text-content capitalize">{{ value }}</h4>
    <ng-container *ngIf="!isFixedText">
      <label *ngIf="label" class="form-control-label">{{ label }}</label>
      <textarea
        rows="3"
        class="form-control"
        [(ngModel)]="parent[key]"
        [ngModelOptions]="{ standalone: true }"
      ></textarea>
    </ng-container>
  </ng-container>

  <div *ngIf="isObject" class="space-y-3" [ngClass]="{ 'pl-3 border-l-2 border-content-30': label }">
    <h4 *ngIf="label" class="text-sm font-semibold text-content">{{ label }}</h4>
    <app-tree-field *ngFor="let name of entries" [parent]="value" [key]="name" [label]="pretty(name)"></app-tree-field>
  </div>

  <div *ngIf="!isText && !isObject" class="space-y-3" [ngClass]="{ 'pl-3 border-l-2 border-content-30': label }">
    <h4 *ngIf="label" class="text-sm font-semibold text-content">{{ label }}</h4>
    <div *ngFor="let item of value; let i = index" class="flex items-start gap-2">
      <div class="flex-1 min-w-0">
        <app-tree-field [parent]="value" [key]="i" [label]="isRepeatable || isTextItem(item) ? itemLabel(i) : ''"></app-tree-field>
      </div>
      <button *ngIf="isRepeatable && value.length > 1" type="button" class="btn-outline-primary h-8 text-xs" (click)="remove(i)">
        {{ 'Remove' | translate }}
      </button>
    </div>
    <button *ngIf="isRepeatable" type="button" class="btn-outline-primary h-8 text-xs" (click)="add()">
      {{ 'Add another' | translate }}
    </button>
  </div>
</ng-container>
