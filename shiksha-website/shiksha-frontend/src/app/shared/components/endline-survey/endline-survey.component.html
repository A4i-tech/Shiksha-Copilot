<div class="survey">
  <header><strong>{{ 'Endline Survey' | translate }}</strong><span>{{ 'Takes about 1 minute' | translate }}</span><p>{{ 'Your responses help us improve Shiksha Copilot.' | translate }}</p></header>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>1. {{ 'How much time do you take to prepare a lesson plan using Shiksha Copilot?' | translate }}</label>
    <app-dropdown formControlName="shikshaTimeUsage" [dropDownValues]="dropdownOptions['shikshaTimeUsage']" [config]="dropdownConfig"></app-dropdown>

    <label>2. {{ 'Is content from Shiksha Copilot directly usable?' | translate }}</label>
    <app-dropdown formControlName="shikshaUsability" [dropDownValues]="dropdownOptions['shikshaUsability']" [config]="dropdownConfig"></app-dropdown>

    <label>3. {{ 'Which benefits have you experienced?' | translate }}</label>
    <label class="option" *ngFor="let option of options['shikshaBenefits']">
      <input type="checkbox" [checked]="checked('shikshaBenefits', option)" (change)="toggle('shikshaBenefits', option, $any($event.target).checked)"> {{ option | translate }}
    </label>

    <label>4. {{ 'How do you use the time saved?' | translate }}</label>
    <app-dropdown formControlName="shikshaTimeUtilization" [dropDownValues]="dropdownOptions['shikshaTimeUtilization']" [config]="dropdownConfig"></app-dropdown>
    <input *ngIf="form.value.shikshaTimeUtilization === 'Other:'" formControlName="shikshaTimeUtilizationOther" [placeholder]="'Please specify' | translate">

    <label>5. {{ 'Which generated content do you use in class?' | translate }}</label>
    <label class="option" *ngFor="let option of options['shikshaContentUsed']">
      <input type="checkbox" [checked]="checked('shikshaContentUsed', option)" (change)="toggle('shikshaContentUsed', option, $any($event.target).checked)"> {{ option | translate }}
    </label>

    <label>6. {{ 'What difference has the content made for students?' | translate }}</label>
    <label class="option" *ngFor="let option of options['shikshaStudentImpact']">
      <input type="checkbox" [checked]="checked('shikshaStudentImpact', option)" (change)="toggle('shikshaStudentImpact', option, $any($event.target).checked)"> {{ option | translate }}
    </label>

    <p class="error" *ngIf="error">{{ error | translate }}</p>
    <button class="btn-primary" type="submit" [disabled]="submitting">{{ (submitting ? 'Submitting' : 'Submit Survey') | translate }}<span *ngIf="submitting">…</span></button>
  </form>
</div>
