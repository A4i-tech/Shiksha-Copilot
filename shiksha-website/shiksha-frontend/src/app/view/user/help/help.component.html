<div class="help-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-accent"></div>
    <div class="header-content">
      <h1 class="page-title">{{ 'Explore Our Video Guides' | translate }}</h1>
      <p class="page-subtitle">
        {{ 'Step-by-step videos to guide you through Shiksha copilot features and functionalities' | translate }}.
      </p>
    </div>
  </div>

  <!-- Dynamic Video Section (based on user's state) -->
  <div class="section">
    <div class="section-header">
      <span class="lang-badge" [ngClass]="activeSection.badgeClass">{{ activeSection.badgeText }}</span>
      <h3 class="section-title">{{ activeSection.titleKey | translate }}</h3>
      <span class="video-count">{{ activeSection.videos.length }} videos</span>
    </div>

    <div class="video-grid">
      <div class="video-card" *ngFor="let video of activeSection.videos">
        <div class="video-frame-wrapper">
          <iframe
            [src]="video.link"
            width="100%"
            height="185"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
        <div class="video-info">
          <p class="video-title">{{ video.title | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
