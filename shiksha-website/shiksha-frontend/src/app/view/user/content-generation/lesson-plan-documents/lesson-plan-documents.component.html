<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <ng-container *ngFor="let doc of docTypeValues">
    <div
      data-testid="document-card"
      [ngClass]="{ 'disable-download': mode !== 'view' }"
      class="bg-white shadow rounded-lg p-5 flex flex-col md:flex-row items-left md:items-center gap-5 md:gap-0 justify-between border border-primary-50 hover:shadow-md transition"
      *ngIf="doc.type !== 'presentation'"
    >
      <div class="flex items-center space-x-4">
        <div>
          <div class="text-white p-3 rounded-full bg-primary-30">
            <img
              data-testid="docx-icon"
              class="w-8"
              *ngIf="doc.type === 'docx'"
              src="assets/icons/docx-original.svg"
              alt=""
            />
            <img
              class="w-7"
              *ngIf="doc.type === 'ppt'"
              src="assets/icons/ppt-solid.svg"
              alt=""
            />
            <img
              data-testid="pdf-icon"
              class="w-8"
              *ngIf="doc.type === 'pdf'"
              src="assets/icons/pdf-original.svg"
              alt=""
            />
          </div>
        </div>
        <div>
          <p
            class="font-semibold text-gray-800 max-w-52 text-nowrap overflow-hidden text-ellipsis !mb-0"
          >
            {{ doc.name }}
          </p>
          <p class="text-sm text-gray-500">{{ doc.type.toUpperCase() }} file</p>
        </div>
      </div>
      <button
        data-testid="download-btn"
        (click)="downloadDocument(doc.downloadType)"
        class="md:hidden btn-outline-primary"
      >
        Download
      </button>
      <button
        data-testid="download-btn"
        (click)="downloadDocument(doc.downloadType)"
        class="hidden md:block btn-primary"
      >
        Download
      </button>
    </div>

    <div
      data-testid="document-card"
      *ngIf="doc.type === 'presentation'"
      [ngClass]="{ 'disable-download': mode !== 'view' }"
      class="bg-white shadow rounded-lg p-5 flex flex-col md:flex-row items-left md:items-center gap-5 md:gap-0 justify-between border border-primary-50 hover:shadow-md transition"
    >
      <div class="flex items-center gap-4 w-full md:w-auto min-w-0">
        <div>
          <div class="p-3 rounded-full bg-primary-30">
            <img
              class="w-7"
              src="assets/icons/ppt-solid.svg"
              alt=""
              style="filter: brightness(0) saturate(100%) invert(56%) sepia(88%) saturate(1646%) hue-rotate(340deg) brightness(94%) contrast(93%);"
            />
          </div>
        </div>
        <div class="min-w-0">
          <p
            class="font-semibold text-gray-800 !mb-0 break-words"
          >
            {{ doc.name }}
          </p>
          <p class="text-sm text-gray-500">PPTX file</p>
        </div>
      </div>

      <div class="flex flex-wrap md:flex-nowrap items-stretch md:items-center gap-2 w-full md:w-auto">
        <button
          *ngIf="mode !== 'view'"
          class="btn-outline-primary w-full md:w-auto"
          disabled
        >
          Generate
        </button>
        <button
          [hasPermission]="['presentation.generate.lesson-plan']"
          *ngIf="mode === 'view' && !lessonPlanPresentation && !isLoadingLessonPlanPresentation"
          (click)="generateLessonPlanPresentation()"
          class="btn-primary w-full md:w-auto"
          [disabled]="isGeneratingLessonPlanPresentation"
        >
          {{ isGeneratingLessonPlanPresentation ? 'Generating...' : 'Generate' }}
        </button>
        <button
          *ngIf="mode === 'view' && isLoadingLessonPlanPresentation"
          class="btn-outline-primary w-full md:w-auto"
          disabled
        >
          Loading...
        </button>
        <ng-container *ngIf="mode === 'view' && lessonPlanPresentation">
          <span
            *ngIf="!canDownloadLessonPlanPresentation"
            class="inline-flex items-center justify-center px-4 py-2 rounded border border-[#D9E1EC] text-sm text-content-70 bg-white w-full md:w-auto"
          >
            {{ lessonPlanPresentationStatusLabel }}
          </span>
          <button
            data-testid="download-btn"
            *ngIf="canDownloadLessonPlanPresentation"
            (click)="downloadLessonPlanPresentation()"
            class="btn-outline-primary w-full md:w-auto"
          >
            Download
          </button>
          <button
            (click)="viewLessonPlanPresentation()"
            class="btn-primary w-full md:w-auto"
          >
            View
          </button>
        </ng-container>
      </div>
    </div>
  </ng-container>
</div>
<div class="bg-warn-50 p-2 my-4" *ngIf="mode !== 'view'">
  <div class="flex items-center gap-2">
    <img src="assets/icons/Info 2.svg" alt="" />
    <small data-testid="documents-warning-message">{{
      "Documents will be available for download once the lesson plan has been saved."
        | translate
    }}</small>
  </div>
</div>
