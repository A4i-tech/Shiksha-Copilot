<div class="flex flex-col gap-1">
  <div class="flex gap-2 items-center">
    <input
      type="text"
      class="border border-gray-300 rounded px-3 py-2 flex-1"
      [value]="selectedLabel"
      readonly
      placeholder="No chapter picked"
    />
    <button
      type="button"
      class="btn-outline-primary h-9 text-nowrap"
      (click)="open()"
    >
      Pick chapter
    </button>
    <button
      *ngIf="selectedLabel"
      type="button"
      class="text-red-600 underline text-nowrap"
      (click)="clear()"
    >
      Clear
    </button>
  </div>

  <app-modal *ngIf="isOpen">
    <h2 class="text-lg font-semibold mb-2" id="modal-title">Pick a chapter</h2>

    <input
      type="text"
      class="border border-gray-300 rounded px-3 py-2 w-full mb-3"
      placeholder="Search chapters"
      [ngModel]="searchText"
      (ngModelChange)="onSearch($event)"
    />

    <p *ngIf="isLoading" class="py-2 text-sm">Loading chapters...</p>

    <div class="max-h-72 overflow-y-auto mb-3" *ngIf="!isLoading">
      <table class="min-w-full text-left text-sm">
        <thead>
          <tr>
            <th scope="col" class="border-b border-gray-300 px-2 py-1">Chapter</th>
            <th scope="col" class="border-b border-gray-300 px-2 py-1">Class</th>
            <th scope="col" class="border-b border-gray-300 px-2 py-1">Board</th>
            <th scope="col" class="border-b border-gray-300 px-2 py-1">Medium</th>
            <th scope="col" class="border-b border-gray-300 px-2 py-1"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let chapter of listData" class="border-b border-gray-200">
            <td class="px-2 py-1">{{ chapter.topics }}</td>
            <td class="px-2 py-1">{{ chapter.standard }}</td>
            <td class="px-2 py-1">{{ chapter.board }}</td>
            <td class="px-2 py-1">{{ chapter.medium }}</td>
            <td class="px-2 py-1">
              <button type="button" class="text-primary underline" (click)="pick(chapter)">
                Pick
              </button>
            </td>
          </tr>
          <tr *ngIf="!listData.length">
            <td class="px-2 py-2" colspan="5">No chapters found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-pagination
      *ngIf="totalItems > pageSize"
      [totalItems]="totalItems"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      (pageChange)="onPageChange($event)"
    ></app-pagination>

    <div class="flex justify-end mt-3">
      <button
        type="button"
        class="px-4 py-2 border border-gray-300 rounded"
        (click)="close()"
      >
        Cancel
      </button>
    </div>
  </app-modal>
</div>
