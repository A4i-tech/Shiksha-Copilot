<header
  class="sticky z-30 top-0 header shadow-md py-2 px-4 md:px-8 flex justify-between lg:justify-end items-center"
>
  <button
    class="p-2 rounded-md lg:hidden"
    type="button"
    (click)="openSidebar()"
    aria-label="Open navigation menu"
    [attr.aria-expanded]="sidebarService.sidebarOpen() ? 'true' : 'false'"
  >
    <svg
      class="w-5 h-5 text-content-80"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 17 14"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M1 1h15M1 7h15M1 13h15"
      />
    </svg>
  </button>
  <div class="flex items-center gap-3">
    <a
      *ngIf="utilityService.hasPermission(['generation.status.view'])"
      routerLink="/generation-status"
      title="Generation Status"
      class="relative flex items-center justify-center w-11 h-11 rounded-full border transition-colors"
      [ngClass]="router.url.includes('/generation-status') ? 'bg-[#EDF6FE] border-primary' : 'bg-white border-[#D9E1EC] hover:bg-[#EDF6FE]'"
    >
      <img
        class="w-5 h-5"
        [ngClass]="{ 'status-activity-spin': activeGenerationCount > 0 && !router.url.includes('/generation-status') }"
        [src]="router.url.includes('/generation-status') ? 'assets/icons/generation-status-light.svg' : 'assets/icons/generation-status.svg'"
        alt="Generation Status"
      />
      <span
        *ngIf="activeGenerationCount > 0 && !router.url.includes('/generation-status')"
        class="absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-[#DE3B40] text-white text-[10px] font-bold flex items-center justify-center shadow-sm"
      >
        {{ activeGenerationCount > 99 ? '99+' : activeGenerationCount }}
      </span>
    </a>

    <div class="relative">
      <button
        type="button"
        class="focus:outline-none rounded-full cursor-pointer focus-visible:ring-2 focus-visible:ring-primary-100"
        (click)="toggleMenu()"
        aria-label="Open profile menu"
        [attr.aria-expanded]="isMenuOpen ? 'true' : 'false'"
        aria-haspopup="true"
      >
        <app-profile-image
          [profileImage]="sidebarService.profileImg()"
          [size]="'md'"
        ></app-profile-image>
      </button>
      <div
        *ngIf="isMenuOpen"
        class="absolute right-0 mt-2 w-60 bg-white rounded shadow-lg p-4"
      >
        <div class="flex items-center gap-4 bg-[#EDF6FE] mb-2 p-4 rounded-xl">
          <app-profile-image
            [profileImage]="this.sidebarService.profileImg()"
            [size]="'md'"
          ></app-profile-image>
          <div>
            <p
              class="text-content text-sm font-semibold overflow-hidden whitespace-nowrap text-ellipsis w-[120px]"
            >
              {{ utilityService.loggedInUserData?.identity?.name | titlecase }}
            </p>
            <p
              class="text-content text-xs font-light overflow-hidden whitespace-nowrap text-ellipsis w-[120px]"
            >
              {{ utilityService.loggedInUserData?.identity?.email }}
            </p>
          </div>
        </div>
        <hr>
        <div
          class="flex items-center p-3 gap-2 mt-2 hover:bg-[#EDF6FE] rounded-lg cursor-pointer"
          (click)="openModalForLogoutConfirm()"
        >
          <img
            class="menu-icon w-5"
            src="assets/icons/logout.svg"
            alt=""
          />
          <p class="text-sm text-shade">{{ 'Logout' | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</header>

<app-delete-detail
  *ngIf="showLogoutConfirm"
  [config]="{
    heading: 'Confirm',
    confirmationText: 'Do you want to logout?',
    primaryButtonLabel: 'Logout',
    primaryButtonType: 'logout'
  }"
  (close)="closeModal($event)"
></app-delete-detail>
