<div class="fixed inset-0 flex overflow-hidden flex-col lg:flex-row">
  <app-sidebar class="sticky top-0 lg:static bg-tertiary-30 z-50"></app-sidebar>
  <div class="min-h-0 min-w-0 flex-1 overflow-y-auto main-content">
    <app-header class="block"></app-header>
    <main id="main-content" tabindex="-1" class="relative min-h-full lg:p-9">
      <ngx-spinner
        [fullScreen]="false"
        bdColor="rgba(240, 240, 240, 0.3)"
        size="medium"
        color="#46A0F1"
        type="ball-scale-multiple"
      >
        <p class="text-black text-sm">{{ (loaderMessage.message$ | async) ?? '' | translate }}</p>
      </ngx-spinner>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
