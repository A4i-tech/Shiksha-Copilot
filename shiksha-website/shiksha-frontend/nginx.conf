worker_processes  auto;
pid               /tmp/nginx/nginx.pid;
error_log         /dev/stderr warn;

events {
  worker_connections  1024;
}

http {
  include              /etc/nginx/mime.types;
  default_type         application/octet-stream;
  access_log           /dev/stdout;
  sendfile             on;
  tcp_nopush           on;
  keepalive_timeout    65;

  # non-root nginx: all writable scratch paths under a dir appuser owns
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  server {
    listen       8000;
    server_name  _;
    root         /srv;
    index        index.html;

    # Runtime config, rewritten by docker-entrypoint.sh on every container
    # start. A cached copy would pin the app to a previous deploy's backend
    # URL / Turnstile key.
    location = /assets/env.js {
      add_header Cache-Control "no-store" always;
    }

    # Angular SPA: unknown routes fall back to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
