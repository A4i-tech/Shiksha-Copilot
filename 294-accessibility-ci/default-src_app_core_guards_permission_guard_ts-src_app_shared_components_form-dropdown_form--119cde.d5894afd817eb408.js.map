<div class="relative z-[1000]" aria-labelledby="modal-title" role="dialog" aria-modal="true" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity duration-500"></div>
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:items-center sm:p-3">
            <div class="relative w-[100%] md:w-[40%] transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 ">
                <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4" #modalBody (click)="stopPropagation($event)">
                    <ng-content></ng-content>
                </div>                
            </div>
        </div>
    </div>
</div>
