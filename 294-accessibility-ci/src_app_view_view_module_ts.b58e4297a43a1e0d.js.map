<div
  class="sidebar-backdrop lg:h-full"
  [ngClass]="isSidebarOpen ? 'show' : 'hide'"
  (click)="closeSidebar($event)"
>
  <nav
    class="grid sidebar p-4 top-0 bottom-0 left-0 w-[270px] bg-white fixed z-[999] lg:static h-full overflow-y-auto"
    [ngClass]="isSidebarOpen ? 'show' : 'hide'"
    aria-label="Main navigation"
  >
    <div class="text-shade-80 text-xl min-h-0">
      <div class="p-2.5 pl-0 mt-1 flex items-center rounded-md">
        <img src="assets/images/logo.svg" alt="" class="logo" />
        <img
          src="assets/icons/E remove.svg"
          alt="remove"
          class="ml-auto block lg:hidden"
          (click)="closeSidebar($event)"
        />
      </div>

      <div>
        <ng-container *ngFor="let menuItem of menuItems">
          <a
            *ngIf="utilitService.hasPermission(menuItem.permission)"
            class="mt-1 flex text-shade items-center rounded-md px-3 py-4 duration-300 cursor-pointer menu-item focus:outline-none focus:ring-2 focus:ring-primary-100"
            (click)="closeSidebar($event)"
            [routerLinkActive]="'bg-[#EDF6FE] !text-[#0A58A3]'"
            [routerLink]="menuItem.route"
            [attr.aria-current]="isActive(menuItem.match) ? 'page' : null"
            tabindex="0"
          >
            <img
              class="menu-icon w-5"
              [src]="
                isActive(menuItem.match)
                  ? menuItem.lightIcon
                  : menuItem.darkIcon
              "
              alt=""
            />
            <span class="text-sm ml-2">{{ menuItem.text | translate }}</span>
          </a>
        </ng-container>
      </div>
    </div>
  </nav>
</div>
