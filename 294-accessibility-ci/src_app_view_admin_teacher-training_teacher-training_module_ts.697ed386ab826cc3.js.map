<div class="create-batch-wrapper px-4 pt-4 md:px-0 md:pt-0">
  <div class="flex content-center">
    <img
      src="assets/icons/back-arrow.svg"
      routerLink="/teacher-training/view-batch"
      alt=""
      class="cursor-pointer"
    />
    <h1 class="ml-3 text-[32px] leading-[48px] font-bold text-content">
      Teacher Training
    </h1>
  </div>

  <div class="batch-container px-4 py-6 md:px-6 md:py-8 bg-white mt-6 rounded border-content-30 border">
    <div class="flex justify-between content-center">
      <p class="text-content text-[32px] leading-[48px] font-bold tracking-tight">
        Create Batch
      </p>
    </div>

    <div class="batch-form mt-9">
      <form [formGroup]="batchForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="form-control-label" for="batch-name">
              Batch Name <span class="text-[16px] text-error">*</span>
            </label>
            <input
              class="form-control"
              id="batch-name"
              type="text"
              placeholder="Enter batch name"
              autocomplete="off"
              formControlName="batchName"
            />
            <small
              class="form-control-error"
              *ngIf="batchForm.get('batchName')?.invalid && batchForm.get('batchName')?.touched"
            >
              Batch Name is required.
            </small>
          </div>

          <div>
            <label class="form-control-label" for="schedule-date">
              Schedule Date <span class="text-[16px] text-error">*</span>
            </label>
            <input
              class="form-control"
              id="schedule-date"
              type="date"
              formControlName="scheduleDate"
            />
            <small
              class="form-control-error"
              *ngIf="batchForm.get('scheduleDate')?.invalid && batchForm.get('scheduleDate')?.touched"
            >
              Schedule Date is required.
            </small>
          </div>

          <div>
            <app-form-dropdown
              [dropDownControlName]="'trainingType'"
              [dropDownCtrl]="convertToFormControl(batchForm.get('trainingType'))"
              [dropDownValues]="trainingTypeDropdownOptions"
              [config]="trainingTypeDropdownConfig"
              [mode]="mode"
            ></app-form-dropdown>
          </div>

          <div>
            <label class="form-control-label" for="pdf-file">
              Upload Permission Letter
            </label>
            <input
              id="pdf-file"
              type="file"
              (change)="onFileSelected($event)"
              class="form-control-disabled batch-file-input"
              accept=".pdf"
            />
            <small class="text-content-60 text-xs mt-1 block" *ngIf="selectedFile">
              Selected: {{ selectedFile.name }}
            </small>
          </div>
        </div>

        <div class="mt-6">
          <label class="form-control-label" for="description">
            Description <span class="text-[16px] text-error">*</span>
          </label>
          <textarea
            id="description"
            formControlName="description"
            rows="4"
            class="form-control min-h-[110px]"
            placeholder="Provide a brief description"
          ></textarea>
          <small
            class="form-control-error"
            *ngIf="batchForm.get('description')?.invalid && batchForm.get('description')?.touched"
          >
            Description is required.
          </small>
        </div>

        <div class="flex flex-col-reverse sm:flex-row justify-end gap-2 mt-8">
          <button
            type="button"
            class="btn-outline-primary h-9"
            routerLink="/teacher-training/view-batch"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="batchForm.invalid"
            class="btn-primary h-9"
          >
            Create Batch
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
