# AKS (Azure) deployment values
# Usage: helm install superset superset/superset -f values-azure.yaml -n superset --create-namespace

image:
  repository: apache/superset
  tag: "3.1.3"
  pullPolicy: IfNotPresent

init:
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@shiksha.local
    # Set a strong password — override via --set or a separate secret
    password: changeme

configOverrides:
  secret: |
    import os
    SECRET_KEY = os.environ.get('SUPERSET_SECRET_KEY', 'CHANGE_ME_STRONG_KEY')
  rls: |
    FEATURE_FLAGS = {
        "ROW_LEVEL_SECURITY": True,
    }

supersetNode:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

supersetWorker:
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    username: superset
    password: superset         # override via --set postgresql.auth.password=<strong>
    database: superset
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: true
  master:
    persistence:
      size: 5Gi

# Azure LoadBalancer — gets a public IP automatically
service:
  type: LoadBalancer
  port: 80
  targetPort: 8088
  annotations:
    # Uncomment to restrict access to specific CIDRs:
    # service.beta.kubernetes.io/azure-load-balancer-source-ranges: "1.2.3.4/32"

# Analytics DB deployed separately as analytics-postgres
