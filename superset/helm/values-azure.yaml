# AKS (Azure) deployment values
# Usage: helm install superset superset/superset -f values-azure.yaml -n superset --create-namespace
#
# Passwords sourced from superset-app-secrets K8s Secret (provisioned by ESO from Key Vault).
# Before first sync, set these Key Vault secrets:
#   az keyvault secret set --vault-name a4i-kube-dev-kv --name superset-admin-password --value "<pw>"
#   az keyvault secret set --vault-name a4i-kube-dev-kv --name superset-secret-key     --value "<key>"
#   az keyvault secret set --vault-name a4i-kube-dev-kv --name superset-pg-password    --value "<pw>"

image:
  repository: apache/superset
  tag: "3.1.3"
  pullPolicy: IfNotPresent

init:
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@shiksha.local
    passwordSecret: superset-app-secrets
    passwordSecretKey: admin-password

configOverrides:
  secret: |
    import os
    SECRET_KEY = os.environ.get('SUPERSET_SECRET_KEY', '')
  db_uri: |
    import os
    _pg = os.environ.get('SUPERSET_PG_PASSWORD', '')
    SQLALCHEMY_DATABASE_URI = f'postgresql+psycopg2://superset:{_pg}@superset-postgresql:5432/superset'
  feature_flags: |
    FEATURE_FLAGS = {
        "ROW_LEVEL_SECURITY": True,
        "EMBEDDED_SUPERSET": True,
    }
  embedding: |
    GUEST_ROLE_NAME = "Public"
    GUEST_TOKEN_JWT_EXP_SECONDS = 300
    HTTP_HEADERS = {"X-Frame-Options": "ALLOWALL"}
    TALISMAN_CONFIG = {"frame_options": "ALLOWALL", "force_https": False, "content_security_policy": None}
    SESSION_COOKIE_SAMESITE = "None"
    SESSION_COOKIE_SECURE = True

extraEnvRaw:
  - name: SUPERSET_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: superset-app-secrets
        key: secret-key
  - name: SUPERSET_PG_PASSWORD
    valueFrom:
      secretKeyRef:
        name: superset-app-secrets
        key: pg-password

supersetNode:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

supersetWorker:
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

postgresql:
  enabled: true
  auth:
    username: superset
    database: superset
    existingSecret: superset-app-secrets
    secretKeys:
      adminPasswordKey: pg-password
      userPasswordKey: pg-password
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: true
  master:
    persistence:
      size: 5Gi

# Internal load balancer — accessible only within Azure VNet.
# For external access, configure ingress-nginx with a hostname instead.
# To allow specific external CIDRs, replace the internal annotation with:
#   service.beta.kubernetes.io/azure-load-balancer-source-ranges: "x.x.x.x/32,y.y.y.y/32"
service:
  type: LoadBalancer
  nodePort:
    http: null
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"

# Analytics DB deployed separately as analytics-postgres
