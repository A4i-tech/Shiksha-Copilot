# Local minikube deployment values
# Usage: helm install superset superset/superset -f values-local.yaml -n superset --create-namespace

image:
  repository: apache/superset
  tag: "3.1.3"
  pullPolicy: IfNotPresent

init:
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@shiksha.local
    password: admin

configOverrides:
  secret: |
    import os, secrets
    SECRET_KEY = os.environ.get('SUPERSET_SECRET_KEY') or secrets.token_hex(42)
  rls: |
    FEATURE_FLAGS = {
        "ROW_LEVEL_SECURITY": True,
    }

supersetNode:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

supersetWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

postgresql:
  enabled: true
  auth:
    username: superset
    password: superset
    database: superset

redis:
  enabled: true

service:
  type: NodePort
  nodePort:
    http: 30088

# Analytics DB deployed separately as analytics-postgres
