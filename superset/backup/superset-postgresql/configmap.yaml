apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-postgresql-backup-script
  namespace: superset
data:
  backup.sh: |
    set -euo pipefail

    echo "--- superset-postgresql Daily Backup ---"

    echo "Initializing Restic Repo: $RESTIC_REPOSITORY"
    restic init || echo "Repo already exists"

    echo "Streaming pg_dump..."
    PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
      --host="$PGHOST" --username="$PGUSER" --dbname="$PGDATABASE" --format=custom | \
      restic backup --stdin --stdin-filename "superset-postgresql-$(date +%Y%m%d).dump" --tag "daily"

    echo "Pruning old snapshots (keep last 14 daily)..."
    restic forget --keep-daily 14 --prune

    echo "--- Success ---"
