[tool.poetry]
name = "shiksha-copilot-fastapi"
version = "1.0.0"
description = "AI-powered educational chat API for Shiksha platform"
authors = ["Shiksha Development Team <dev@shiksha.org>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "~3.11"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
pydantic = "^2.13.4"
python-dotenv = "^1.0.0"
aiofiles = "^23.2.1"
pyyaml = "^6.0.1"
azure-ai-translation-text = "^1.0.1"
aiohttp = "^3.13.5"
vellm-rag-wrapper = { path = "../../components/rag-wrapper", develop = true }
pydantic-settings = "^2.14.1"
fastmcp = "^3.2.4"
langdetect = "^1.0.9"
openai = "^2.32.0"
python-pptx = "^1.0.2"
pymongo = "^4.17.0"
pydantic-ai = "^2.21.0"
pymupdf = "^1.27.2.3"
pillow = "^12.2.0"
pymupdf4llm = "^1.27.2.3"
fsspec = "^2026.4.0"
adlfs = "^2026.5.0"
tenacity = "^9.1.4"
python-magic = "^0.4.27"
langfuse = "3.14.6"
llama-index-core = "^0.14.22"
llama-index-llms-openai = "^0.7.9"
llama-index-embeddings-openai = "^0.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^0.21.1"
pytest-cov = "^7.0.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.5.0"

[tool.poetry.group.test.dependencies]
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra -v --strict-markers --tb=short --cov=app --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml --cov-branch --asyncio-mode=auto"
markers = [
  "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
