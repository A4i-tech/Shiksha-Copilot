[project]
name = "shiksha-copilot-fastapi"
version = "1.0.0"
description = "AI-powered educational chat API for Shiksha platform"
authors = [
  { name = "Shiksha Development Team", email = "dev@shiksha.org" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.136.1,<0.137.0",
  "uvicorn>=0.46.0,<0.47.0",
  "pydantic>=2.13.4,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "aiofiles>=23.2.1,<24.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "azure-core==1.41.0",
  "azure-ai-translation-text>=1.0.1,<2.0.0",
  "azure-storage-blob==12.30.0",
  "aiohttp>=3.13.5,<4.0.0",
  "vellm-rag-wrapper",
  "pydantic-settings>=2.14.1,<3.0.0",
  "fastmcp>=3.2.4,<4.0.0",
  "langdetect>=1.0.9,<2.0.0",
  "openai>=2.32.0,<3.0.0",
  "python-pptx>=1.0.2,<2.0.0",
  "pymongo>=4.17.0,<5.0.0",
  "pydantic-ai-slim[openai]>=1.95.0,<2.0.0",
  "pymupdf>=1.27.2.3,<2.0.0",
  "pillow>=12.2.0,<13.0.0",
  "pymupdf4llm>=1.27.2.3,<2.0.0",
  "fsspec>=2026.4.0,<2027.0.0",
  "adlfs>=2026.5.0,<2027.0.0",
  "tenacity>=9.1.4,<10.0.0",
  "python-magic>=0.4.27,<0.5.0",
  "logfire==4.37.0",
  "llama-index-core==0.14.23",
  "llama-index-embeddings-azure-openai==0.5.2",
  "llama-index-embeddings-openai==0.6.0",
  "llama-index-llms-azure-openai==0.5.5",
  "llama-index-llms-openai==0.7.9",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=0.21.1,<0.22.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "black>=23.11.0,<24.0.0",
  "isort>=5.12.0,<6.0.0",
  "flake8>=6.1.0,<7.0.0",
  "mypy>=1.7.1,<2.0.0",
  "pre-commit>=3.5.0,<4.0.0",
]
test = [
  "pytest-mock>=3.12.0,<4.0.0",
]

[tool.uv.sources]
vellm-rag-wrapper = { path = "../../components/rag-wrapper", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-report json:coverage.json --cov-report=html -v --tb=short --strict-markers"
markers = [
  "unit: marks tests as unit tests",
  "integration: marks tests as integration tests",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/venv/*", "*/virtualenv/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]
