  english:  |
    ## Objectives & Bloom’s Taxonomy (English-only)

    1. **Knowledge** (*Remember*)  
      - **Definition**: Assess recall of vocabulary, grammar terms, definitions, and simple facts.  
      - **Verbs**: identify, name, select, choose, define, state, recall  
      - **Sample Stems**:  
        - Identify the synonym of the underlined word …  
        - Choose the correct antonym for the highlighted term …  
        - Select the word which rhymes with “…” …  
        - State the meaning of the italicized phrase …  

    2. **Understanding** (*Understand*)  
      - **Definition**: Gauge comprehension of passages, explanations, and conceptual differences.  
      - **Verbs**: explain, interpret, describe, summarize, infer  
      - **Sample Stems**:  
        - Explain why …  
        - Describe how …  
        - Summarize the main idea of the passage …  
        - Interpret the information presented and explain what it indicates …  

    3. **Application** (*Apply*)  
      - **Definition**: Use grammar rules or vocabulary in context to complete or correct sentences.  
      - **Verbs**: apply, fill, complete, use, correct, transform  
      - **Sample Stems**:  
        - Fill in the blank with the correct form of the verb …  
        - Use the appropriate determiner to complete the sentence …  
        - Apply the correct preposition in the sentence …  
        - Correct the verb tense to match the required time frame …  

    4. **Skill** (*Analyze/Evaluate*)  
      - **Definition**: Analyze structures, compare forms, and sequence information.  
      - **Verbs**: analyze, compare, contrast, categorize, rearrange, sequence  
      - **Sample Stems**:  
        - Rearrange the following steps in the correct order …  
        - Categorize the given words into appropriate groups …  
        - Compare the active and passive forms of the sentence …  
        - Analyze the structure of the text and identify its key features …  

    5. **Comprehension** (*Understand, language-focused*)  
      - **Definition**: Transform or reorder language units; focus on structural understanding.  
      - **Verbs**: convert, transform, reorder, identify, interpret  
      - **Sample Stems**:  
        - Change the paragraph into the specified tense …  
        - Reorder the jumbled sentences to form a coherent paragraph …  
        - Identify the correct sequence of steps for the process described …  

    6. **Expression** (*Create*)  
      - **Definition**: Produce original writing—narratives, letters, paragraphs.  
      - **Verbs**: write, compose, construct, draft, develop, design  
      - **Sample Stems**:  
        - Write a paragraph on the topic …  
        - Construct a story from the given outline …  
        - Draft a letter to … about …  

    7. **Appreciation** (*Evaluate*)  
      - **Definition**: Critique language choices; justify stylistic or structural decisions.  
      - **Verbs**: evaluate, assess, critique, justify, recommend  
      - **Sample Stems**:  
        - Evaluate the appropriateness of the format used …  
        - Critique the coherence and structure of your writing …  
        - Justify why a particular choice is the best option …  
        - Assess the clarity of the message and suggest improvements …  

  general: |
    ## Objectives & Bloom’s Taxonomy

    Below are the **seven objectives** with their definitions, recommended verbs, and sample stems. For each generated question, 
    match the objective's cognitive level and ensure the language prompts multi-step reasoning and application to real-world scenarios. 
    Adapt complexity based on the specified grade.

    1. **Knowledge** (*Remember*)
      - **Definition**: Assesses recall and recognition of facts, definitions, principles, and concepts.
      - **Verbs**: tell, list, describe, relate, locate, write, find, state, name
      - **Sample Stems**:
        - What happened after ...?
        - How many ...?
        - Who was it that ...?
        - Can you name the ...?
        - Describe what happened at...?
        - Can you tell why ...?
        - Find the meaning of ...?
        - Which is true or false ... ?

    2. **Understanding** (*Understand*)
      - **Definition**: Evaluates depth of conceptual comprehension; focuses on explaining processes, 
        concepts, and relationships meaningfully.
      - **Verbs**: explain, interpret, outline, discuss, distinguish, predict, restate, compare, describe
      - **Sample Stems**:
        - Can you write in your own words...?
        - Can you write a brief outline...?
        - What do you think could have happened next...?
        - What was the main idea...?
        - Can you distinguish between...?
        - Can you provide a definition for...?

    3. **Application** (*Apply*)
      - **Definition**: Assesses the ability to use learned concepts to solve practical or real-world problems.
      - **Verbs**: solve, show, use, illustrate, construct, complete, examine, classify
      - **Sample Stems**:
        - Do you know another instance where...?
        - Could this have happened in...?
        - Can you group by characteristics such as...?
        - What factors would you change if...?
        - Can you apply the method used to your own experience...?
        - Would this information be useful if you had a...?

    4. **Skill** (*Analyze/Evaluate*)
      - **Definition**: Evaluates practical, analytical, and problem-solving skills.
      - **Verbs**: analyze, distinguish, examine, compare, contrast, investigate, categorize, identify, explain, separate, advertise
      - **Sample Stems**:
        - Which events could have happened...?
        - If ... happened, what might the ending have been...?
        - Why did ... changes occur?
        - Can you explain what must have happened when...?
        - What are some of the problems of...?
        - What was the turning point...?

    5. **Comprehension** (*Understand, with emphasis on language*)
      - **Definition**: Measures understanding of written or spoken language, focusing on interpretation of key themes, contexts, and underlying ideas.
      - **Verbs**: (Use those from “Understanding” plus any language-focused ones: interpret, discuss, compare...)
      - **Sample Stems**:
        - Can you translate or restate ... in your own words?
        - What is the main theme of ...?
        - Can you clarify the meaning of ...?
        - Compare how ... is represented here with ...?

    6. **Expression** (*Create*)
      - **Definition**: Assesses the ability to communicate clearly and effectively, including writing or presentations.
      - **Verbs**: create, invent, compose, predict, plan, construct, design, imagine, propose, devise
      - **Sample Stems**:
        - Can you design a ... to ...?
        - Why not compose a short piece about ...?
        - Can you see a possible solution to ...?
        - How many ways can you ...?
        - Can you develop a proposal which would ...?

    7. **Appreciation** (*Evaluate*)
      - **Definition**: Involves analysis and critique of texts and encourages evaluative thinking and personal judgment.
      - **Verbs**: judge, select, choose, decide, debate, verify, recommend, assess, rate, determine
      - **Sample Stems**:
        - Is there a better solution to ...?
        - Judge the value of ...?
        - Can you defend your position about ...?
        - Do you think ... is good or bad?
        - What changes to ... would you recommend?
        - What do you think about ...?

  telangana-science: |
    ## Objectives & Bloom’s Taxonomy (Telangana State Board — Science)

    Below are the **seven objectives** used for Science in the Telangana State Board Academic Standards, with their definitions, recommended verbs, and sample stems. For each generated question,
    match the objective's cognitive level and ensure the language prompts multi-step reasoning and application to real-world scenarios.
    Adapt complexity based on the specified grade.

    1. **Conceptual Understanding**
      - **Definition**: Assesses recall and understanding of scientific facts, concepts, principles, and terms.
      - **Verbs**: define, state, explain, describe, identify, classify
      - **Sample Stems**:
        - Can you explain why ... happens?

    2. **Asking questions and making hypothesis**
      - **Definition**: Assesses the ability to raise relevant scientific questions and propose a testable hypothesis.
      - **Verbs**: ask, question, predict, hypothesize, propose
      - **Sample Stems**:
        - What hypothesis would you propose to explain ...?

    3. **Experimentation and field investigation**
      - **Definition**: Assesses the ability to plan and carry out an experiment or field investigation and to record observations.
      - **Verbs**: design, conduct, observe, record, measure, investigate
      - **Sample Stems**:
        - How would you design an experiment to test ...?

    4. **Information skills and Projects**
      - **Definition**: Assesses the ability to collect, organise, and interpret information from multiple sources and to complete a project.
      - **Verbs**: collect, organise, tabulate, interpret, present
      - **Sample Stems**:
        - How would you collect and organise data to find out ...?

    5. **Communication through drawing, model making**
      - **Definition**: Assesses the ability to express scientific understanding through labelled diagrams, models, or charts.
      - **Verbs**: draw, label, sketch, model, illustrate
      - **Sample Stems**:
        - Can you draw a labelled diagram to show ...?

    6. **Appreciation and aesthetic sense, values**
      - **Definition**: Assesses appreciation of the beauty and wonder of nature and the values and ethics that guide scientific work.
      - **Verbs**: appreciate, value, admire, reflect
      - **Sample Stems**:
        - What do you appreciate about ...?

    7. **Application to daily life, concern to biodiversity**
      - **Definition**: Assesses the ability to apply scientific knowledge to daily life and to show concern for the environment and biodiversity.
      - **Verbs**: apply, use, relate, protect, conserve
      - **Sample Stems**:
        - How can you use the idea of ... in your daily life?

  telangana-social: |
    ## Objectives & Bloom’s Taxonomy (Telangana State Board — Social Studies)

    Below are the **five objectives** used for Social Studies in the Telangana State Board Academic Standards, with their definitions, recommended verbs, and sample stems. For each generated question,
    match the objective's cognitive level and ensure the language prompts multi-step reasoning and application to real-world scenarios.
    Adapt complexity based on the specified grade.

    1. **Conceptual Understanding**
      - **Definition**: Assesses recall and understanding of social, economic, political, and historical concepts and terms.
      - **Verbs**: define, state, explain, describe, identify
      - **Sample Stems**:
        - Can you explain what is meant by ...?

    2. **Reading the text, understanding and interpretation**
      - **Definition**: Assesses the ability to read a passage, source, or map and to interpret its meaning.
      - **Verbs**: read, interpret, infer, summarise, analyse
      - **Sample Stems**:
        - What can you infer from the given passage about ...?

    3. **Information skills**
      - **Definition**: Assesses the ability to gather, organise, and use information from sources such as newspapers, statistics, or reports.
      - **Verbs**: collect, organise, classify, compare, use
      - **Sample Stems**:
        - How would you organise the given information about ...?

    4. **Reflection on contemporary issues and questioning**
      - **Definition**: Assesses the ability to critically reflect on contemporary social issues and to raise pertinent questions.
      - **Verbs**: question, reflect, critique, examine, argue
      - **Sample Stems**:
        - What questions would you raise about ...?

    5. **Appreciation and sensitivity**
      - **Definition**: Assesses appreciation of social and cultural diversity and sensitivity towards constitutional values and the rights of others.
      - **Verbs**: appreciate, value, respect, empathise
      - **Sample Stems**:
        - Why is it important to appreciate ...?

  telangana-math: |
    ## Objectives & Bloom’s Taxonomy (Telangana State Board — Mathematics)

    Below are the **five objectives** used for Mathematics in the Telangana State Board Academic Standards, with their definitions, recommended verbs, and sample stems. For each generated question,
    match the objective's cognitive level and ensure the language prompts multi-step reasoning and application to real-world scenarios.
    Adapt complexity based on the specified grade.

    1. **Problem solving**
      - **Definition**: Assesses the ability to select and apply an appropriate strategy to solve a mathematical problem.
      - **Verbs**: solve, calculate, find, determine, apply
      - **Sample Stems**:
        - How would you solve the following problem: ...?

    2. **Reasoning proof**
      - **Definition**: Assesses the ability to reason logically and to justify or prove a mathematical statement.
      - **Verbs**: justify, prove, reason, verify, deduce
      - **Sample Stems**:
        - Can you justify why ... is true?

    3. **Communication**
      - **Definition**: Assesses the ability to express mathematical ideas clearly using words, symbols, or notation.
      - **Verbs**: explain, describe, express, state
      - **Sample Stems**:
        - Can you explain in your own words how you found ...?

    4. **Connections**
      - **Definition**: Assesses the ability to connect a mathematical idea to other mathematical ideas, other subjects, or daily life.
      - **Verbs**: relate, connect, apply, link
      - **Sample Stems**:
        - How does ... relate to what you already know about ...?

    5. **Visualization and representation**
      - **Definition**: Assesses the ability to represent a mathematical idea using a diagram, graph, table, or model.
      - **Verbs**: draw, represent, plot, sketch, model
      - **Sample Stems**:
        - Can you represent ... using a diagram or graph?

