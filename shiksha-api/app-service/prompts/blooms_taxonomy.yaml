    match the objective's cognitive level and ensure the language prompts multi-step reasoning and application to real-world scenarios.
    Adapt complexity based on the specified grade.

    1. **Knowledge**
      - **Definition**: Assesses recall of vocabulary, grammar terms, definitions, and simple facts.
      - **Verbs**: identify, name, select, choose, define, state, recall
      - **Sample Stems**:
        - Identify the synonym of the underlined word …

    2. **Understanding**
      - **Definition**: Assesses comprehension of passages, explanations, and conceptual differences.
      - **Verbs**: explain, interpret, describe, summarise, infer
      - **Sample Stems**:
        - Summarise the main idea of the passage …

    3. **Application**
      - **Definition**: Assesses the ability to use grammar rules or vocabulary in context to complete or correct sentences.
      - **Verbs**: apply, fill, complete, use, correct, transform
      - **Sample Stems**:
        - Fill in the blank with the correct form of the verb …

    4. **Higher order thinking**
      - **Definition**: Assesses the ability to analyse, evaluate, and create original responses that go beyond the given text.
