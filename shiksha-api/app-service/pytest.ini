[pytest]
# Pytest configuration for Shiksha API tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Add options
addopts =
    --import-mode=importlib
    -ra
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-branch
    --asyncio-mode=auto

# Markers for test organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end flows
    slow: Slow running tests
    requires_azure: Tests that require Azure services
    requires_qdrant: Tests that require Qdrant vector database

# Coverage settings
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore these in coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
