pipeline_id: shiksha_chapter
parameters:
  properties:
    start_page:
      type: integer
      minimum: 1
      default: 1
      description: First page used to extract textbook metadata
    end_page:
      type: integer
      minimum: 1
      default: 16
      description: Last page used to extract textbook metadata
    prompt_template:
      type: string
      default: You are a metadata creating agent for a school textbook. You return textbook metadata.
      description: Prompt used for textbook metadata extraction
    toc_start_page:
      type: integer
      minimum: 1
      default: 8
      description: First page to scan for the table of contents
    toc_end_page:
      type: integer
      minimum: 1
      default: 12
      description: Last page to scan for the table of contents
    chapter_start_page:
      type: integer
      minimum: 1
      default: 9
      description: First page to scan while finding Chapter 1 offset
    chapter_end_page:
      type: integer
      minimum: 1
      default: 18
      description: Last page to scan while finding Chapter 1 offset
steps:
  - agent: page_chunking
    description: Split PDF pages
    config:
      mode: pdf
  - agent: extract
    description: Extract textbook metadata
    stage: analysis
    config:
      concurrency: 5
      foreach: "."
      input: '[.items[] | select(.metadata.page >= ${.config.start_page} and .metadata.page <= ${.config.end_page}) | .id]'
      path: ".metadata.shiksha_chapter"
      prompt: "${.config.prompt_template}"
      schema:
        type: object
        properties:
          board:
            type: string
            enum: [CBSE, BSE-TG, KSEEB]
            minLength: 1
            description: Curriculum board
          medium:
            type: string
            minLength: 1
            description: Instruction medium
            examples: [English]
          grade:
            type: integer
            minimum: 1
            description: Grade level
            examples: [6, 7]
          subject:
            type: string
            minLength: 1
            description: Subject name.
            examples: [Mathematics, Science, English]
          subject_norm:
            type: string
            minLength: 1
            description: Subject name for indices, these are usually shorter and lowercase. See examples.
            examples: [math, science, english, social]
        required: [board, medium, grade, subject, subject_norm]
  - agent: extract
    description: Extract table of contents
    stage: analysis
    config:
      retries: 3
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.toc_start_page} and .metadata.page <= ${.config.toc_end_page}) | .id]'
      path: ".metadata.toc"
      prompt: |
        You are an agent that searches a PDF until you find the table of contents page.
        The table of contents lists textbook chapters and their page numbers.
        Read page-by-page by invoking the see_next tool.
        Stop immediately once you have found the entire table of contents, then return the structured table of contents.
        Ignore appendices; only include actual textbook chapters.
      assertions:
        - expr: "[.records[:-1][] | select(.page_end == null)] | length == 0"
          feedback: "Only last TOC record may have null page_end"
        - expr: "[.records[].no] == [range(1; (.records | length) + 1)]"
          feedback: "Chapter numbers must be unique and sequential"
      schema:
        type: object
        properties:
          page_no:
            type: integer
            minimum: 1
            description: Page number where this table of contents is
          records:
            type: array
            description: Table of contents
            items:
              type: object
              properties:
                "no":
                  type: integer
                  minimum: 1
                  description: Textbook chapter number
                name:
                  type: string
                  minLength: 1
                  description: Official chapter title. Do not include chapter number or numbering prefix.
                  examples: [Electric Current, The Human Eye and the Colourful World]
                page_begin:
                  type: integer
                  minimum: 1
                  description: Page at which the chapter begins
                page_end:
                  type: [integer, "null"]
                  minimum: 1
                  description: Page at which the chapter ends. Use null only when uncertain and it is the last TOC record.
              required: ["no", name, page_begin, page_end]
        required: [page_no, records]
  - agent: extract
    description: Find Chapter 1 offset
    stage: analysis
    config:
      retries: 5
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.chapter_start_page} and .metadata.page <= ${.config.chapter_end_page}) | .id]'
      path: ".metadata.chapter_1_offset"
      prompt: |
        You are a textbook reading agent.
        Read page-by-page by invoking the see_next tool.
        Stop when you encounter Chapter 1 in the textbook.
        Return whether Chapter 1 was found and the page where it starts.
      schema:
        type: object
        properties:
          found:
            type: boolean
            description: Whether Chapter 1 was found
          page:
            type: integer
            description: Page where Chapter 1 starts
          reason:
            type: string
            description: Brief explanation
        required: [found, page]
    validation:
      - mode: after
        expr: ".metadata.chapter_1_offset.found == true"
        message: "Chapter 1 was not found: ${.metadata.chapter_1_offset.reason}"
  - agent: page_stitching
    description: Stitch chapter PDFs
    config:
      foreach: |
        . as $doc
        | .metadata as $m
        | ($m.chapter_1_offset.page - $m.toc.records[0].page_begin) as $offset
        | $m.toc.records[]
        | . as $r
        | {
            record: $r,
            context: (
              "- Chapter number: \($r.no)\n"
              + "- Chapter name: \($r.name)\n"
              + "- Subject: \($m.shiksha_chapter.subject)\n"
              + "- Grade: \($m.shiksha_chapter.grade)\n"
              + "- Educational board (India): \($m.shiksha_chapter.board)"
            ),
            ids: [
              $doc.items[]
              | select(.metadata.page >= ($offset + $r.page_begin) and .metadata.page <= (if $r.page_end == null then ($doc.items | length) else ($offset + $r.page_end) end))
              | .id
            ]
          }
      input: ".ids"
      metadata: '{record: .record, context: .context, content_type: "application/pdf"}'
      replace: true
    validation:
      - mode: after
        expr: "([.items[].metadata.record.no] | sort) == ([.metadata.toc.records[].no] | sort)"
        message: "Not all expected chapters were stitched (found ${[.items[].metadata.record.no]})"
  - agent: extract
    description: Extract chapter content
    config:
      retries: 5
      concurrency: 5
      foreach: ".items[]"
      input: "[.id]"
      context: ".metadata.context"
      path: ".metadata.chapter"
      prompt: |
        You are an agent that generates structured chapter content from a chapter PDF.

        Rules:
        - Topic titles must be copied verbatim from section and subsection headings in the textbook.
        - When collapsing content into a section heading, ensure all learning outcomes belong to that section and its subsections.
        - Do not attach learning outcomes from earlier sections to a later topic.
        - Learning outcomes should include concepts taught within the topic's section and its immediate subsections, but must not include content from later sections.
      assertions:
        - expr: '([ .topic_groups[].topics[] ] - [ .topics[].title ]) | unique | length == 0'
          feedback: "Unknown topics in topic_groups"
      schema:
        type: object
        properties:
          topics:
            type: array
            minItems: 1
            description: Ordered topic-wise breakdown of the chapter
            items:
              type: object
              properties:
                numbering:
                  type: string
                  minLength: 2
                  pattern: '^\d+(?:\.\d+)+$'
                  description: The section numbering, beginning with the chapter number.
                  examples: ["1.1", "1.2.1"]
                title:
                  type: string
                  minLength: 1
                  description: Section or subsection title from the textbook, without numbering.
                  examples: [Introduction, Properties of Matter, Physical Changes]
                learning_outcomes:
                  type: array
                  minItems: 1
                  description: Outcomes students should achieve after learning this topic
                  items:
                    type: string
              required: [numbering, title, learning_outcomes]
          topic_groups:
            type: array
            minItems: 1
            description: Period-wise lesson groupings covering the chapter in teaching order
            items:
              type: object
              properties:
                topics:
                  type: array
                  minItems: 1
                  description: Topic titles from the chapter that are taught together in one lesson period
                  items:
                    type: string
              required: [topics]
        required: [topics, topic_groups]
  - agent: transform
    description: Build Shiksha JSON
    config:
      value: |
        .metadata.shiksha_chapter as $m
        | .items
        | sort_by(.metadata.record.no)
        | map(
            .metadata.record as $r
            | .metadata.chapter as $c
            | ($c.topics | map(
                . as $topic
                | ($topic.numbering + ". " + $topic.title) as $title
                | {
                    key: $topic.title,
                    value: {
                      title: $title,
                      learning_outcomes: $topic.learning_outcomes
                    }
                  }
              )) as $topic_entries
            | ($topic_entries | from_entries) as $topic_map
            | {
                "_id": (
                  "Board=\($m.board),"
                  + "Medium=\($m.medium | ascii_downcase),"
                  + "Grade=\($m.grade),"
                  + "Subject=\($m.subject_norm),"
                  + "Number=\($r.no),"
                  + "Title=\($r.name)"
                ),
                chapter_number: $r.no,
                chapter_title: $r.name,
                topics: ($topic_entries | map(.value)),
                topic_groups: ($c.topic_groups | map({topics: (.topics | map($topic_map[.].title))})),
                summary: "",
                learning_outcomes: [],
                index_path: (
                  "qdrant/\($m.board)/chapter_id:"
                  + "Medium=\($m.medium | ascii_downcase),"
                  + "Grade=\($m.grade),"
                  + "Subject=\($m.subject_norm),"
                  + "Number=\($r.no)"
                ),
                preferred_mot: ""
              }
          )
      path: ".metadata.shiksha"
