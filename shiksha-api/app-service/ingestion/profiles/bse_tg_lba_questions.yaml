pipeline_id: bse_tg_lba_questions
domain_profile: lba_question_extraction
input_modality: text
description: >
  Reads exported BSE-TG lesson JSON files (one per lesson, produced by
  export_bse_tg_lessons.py) and extracts every practice question in the
  lesson's Homework section into structured records for the LBA question
  bank. Output is consumed by load_lba_questions.py, which maps records into
  the shiksha lba_questions schema and writes them to the dump database.

parameters:
  properties:
    marks_default:
      type: integer
      description: Marks assigned to a question when the source text does not state one.
      default: 1

steps:
  - agent: text

  - agent: extract
    config:
      foreach: ".items[]"
      input: .text
      path: .metadata.questions
      concurrency: 4
      prompt: >
        You are extracting practice questions from the Homework section of a
        Telangana (BSE-TG) school lesson. The input is the lesson's export
        JSON: read its "class", "subject", "medium" and "chapterTitle" fields
        and treat them as the lesson context.
        The Homework section groups questions under difficulty bands such as
        Beginner, Intermediate and Advanced, and mixes multiple-choice questions
        with open-answer questions. Extract EVERY question, including every
        sub-question. For each question produce one object with these fields:
        - answerType: exactly one of "mcq", "fill_in_the_blank",
          "one_sentence_answers", "short_answer", "answer_medium", "long_answer",
          "match_the_following". These are the lba_questions collection's own
          type keys, not display labels. Multiple choice with lettered options
          is "mcq". Fill-in-the-blank statements are "fill_in_the_blank".
          One-word or one-phrase answers are "one_sentence_answers". A few
          sentences are "short_answer". A paragraph is "answer_medium". A long
          essay is "long_answer". Match-column questions are
          "match_the_following".
        - groupHeading: the band or heading the question appears under, such as
          "Beginner", "Intermediate", "Advanced"; use "" when there is none.
        - text: the exact question text without the leading number. For
          answerType "match_the_following", leave this "" — put the pairs in
          "pairs" instead.
        - options: for answerType "mcq" only, the option strings exactly as
          printed, without the leading letters. Omit for every other answerType.
        - pairs: for answerType "match_the_following" only, one object per row
          with "left" (the left-column phrase) and "right" (the matching
          right-column phrase as printed). Omit for every other answerType.
        - keyAnswer: the correct answer when stated, else "". The source
          states answers two ways: an explicit "Answer:" line, OR — for MCQs
          especially — the correct option's text simply repeated as its own
          line directly after the four options, with no "Answer:" label or
          lettered prefix stripped. Treat both forms as the stated answer.
          For answerType "match_the_following", always use "" here — the
          match itself is the "right" side of each row in "pairs".
        - marks: the integer mark value stated for the question, or
          ${.config.marks_default} if none is stated.
        Do not skip any sub-question. Do not invent questions that are not in
        the text. Return your answer as JSON: {"questions": [...]}.
        Write all math in plain text, never LaTeX: use "a/b" for fractions,
        "x" for multiplication, "^2" only if unavoidable but prefer "square",
        and write "cm" for units. Do not emit \\frac, \\times, \\text, \\sqrt,
        \\cdot, $ signs, or any backslash commands.
      schema:
        type: object
        properties:
          questions:
            type: array
            items:
              type: object
              properties:
                answerType:
                  type: string
                  enum:
                    - mcq
                    - fill_in_the_blank
                    - one_sentence_answers
                    - short_answer
                    - answer_medium
                    - long_answer
                    - match_the_following
                groupHeading:
                  type: string
                text:
                  type: string
                options:
                  type: array
                  items:
                    type: string
                pairs:
                  type: array
                  items:
                    type: object
                    properties:
                      left:
                        type: string
                      right:
                        type: string
                    required: [left, right]
                keyAnswer:
                  type: string
                marks:
                  type: integer
              required: [answerType, groupHeading, text, keyAnswer, marks]
        required: [questions]
