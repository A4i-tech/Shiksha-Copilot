[project]
name = "shiksha-durable-functions"
version = "0.1.0"
description = "Shiksha Copilot Durable Functions"
authors = [
  { name = "Shiksha OSS Team" },
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "azure-functions==1.23.0",
  "azure-functions-durable==1.2.8",
  "azure-core==1.41.0",
  "pydantic==2.13.4",
  "openai==2.44.0",
  "azure-storage-blob>=12.25.1,<13.0.0",
  "aiofiles>=24.1.0,<25.0.0",
  "aiohttp>=3.14.1,<4.0.0",
  "azure-identity>=1.23.0,<2.0.0",
  "vellm-rag-wrapper",
  "llama-index-embeddings-azure-openai==0.5.2",
  "llama-index-llms-azure-openai==0.5.5",
]

[dependency-groups]
dev = [
  "pytest>=7.0.0,<8.0.0",
  "black==24.3.0",
  "flake8>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
vellm-rag-wrapper = { path = "../../components/rag-wrapper", editable = true }
