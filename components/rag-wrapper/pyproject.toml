[project]
name = "vellm-rag-wrapper"
version = "1.0.0"
description = "A simple RAG Wrapper for easy-to-use APIs to create, update or query indexes using llama index library"
authors = [
  { name = "Kavyansh Chourasia", email = "kchourasia@microsoft.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["llm", "rag", "llama-index", "python"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "tenacity==9.1.4",
  "azure-core==1.41.0",
  "azure-identity==1.25.3",
  "pydantic==2.13.4",
  "qdrant-client==1.18.0",
  "llama-index-core==0.14.23",
  "llama-index-vector-stores-azureaisearch==0.5.0",
  "llama-index-vector-stores-qdrant==0.10.1",
  "azure-search-documents==11.6.0",
  "llama-index-graph-stores-neo4j==0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=7.0.0,<8.0.0",
  "pytest-asyncio>=0.20.2,<0.21.0",
  "black>=23.1,<24.0",
  "flake8>=6.0,<7.0",
  "python-dotenv==1.2.2",
  "llama-index-embeddings-azure-openai==0.5.2",
  "llama-index-llms-azure-openai==0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_wrapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"  # Automatically configures asyncio mode
testpaths = ["tests"]  # Directory where tests are located
log_cli = true         # Enables logging during test execution
log_level = "DEBUG"    # Sets the log level
