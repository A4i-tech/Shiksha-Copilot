services:
  shiksha-mongo-uat-svc:
    # ponytail: pinned to 4.4 — UAT host CPU lacks AVX, required by mongo 5.0+.
    # EOL, no security patches. Upgrade once client provisions an AVX-capable VM.
    image: mongo:4.4
    container_name: shiksha-mongo-uat-container
    restart: unless-stopped
    labels:
      environment: "uat"
      com.shiksha.service: "mongo"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER not set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD not set}
    volumes:
      - /opt/shiksha/data/mongo:/data/db
    networks:
      - shiksha-network
    healthcheck:
      test: ["CMD", "mongo", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shiksha-qdrant-uat-svc:
    image: qdrant/qdrant:latest
    container_name: shiksha-qdrant-uat-container
    restart: unless-stopped
    labels:
      environment: "uat"
      com.shiksha.service: "qdrant"
    volumes:
      - /opt/shiksha/data/qdrant:/qdrant/storage
    networks:
      - shiksha-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  shiksha-network:
    name: shiksha-network
    driver: bridge
