pipeline_id: period_plan
parameters:
  properties:
    start_page:
      type: integer
      minimum: 1
      default: 1
      description: First page used to extract textbook metadata
    end_page:
      type: integer
      minimum: 1
      default: 16
      description: Last page used to extract textbook metadata
    prompt_template:
      type: string
      default: You are a metadata creating agent for a school textbook. You return textbook metadata.
      description: Prompt used for textbook metadata extraction
    toc_start_page:
      type: integer
      minimum: 1
      default: 8
      description: First page to scan for the table of contents
    toc_end_page:
      type: integer
      minimum: 1
      default: 12
      description: Last page to scan for the table of contents
    chapter_start_page:
      type: integer
      minimum: 1
      default: 9
      description: First page to scan while finding Chapter 1 offset
    chapter_end_page:
      type: integer
      minimum: 1
      default: 18
      description: Last page to scan while finding Chapter 1 offset
    created_at:
      type: integer
      minimum: 0
      default: 0
      description: Unix timestamp to write into generated payloads. Use 0 to use the pipeline run time.
    workflow_template:
      type: string
      description: >-
        The lesson-plan workflow template (read from a JSON file by the
        caller), passed as a JSON-encoded string: an object with a top-level
        "_id" and a "sections" array, each section's "description" containing
        ${READING_CONTENT}, ${DISCOURSE_TYPES_MAJOR}, and ${DISCOURSE_TYPES}
        placeholders. Passed as a string, not an object, so omni-ingest's
        ${...} interpolation round-trips it as JSON into the payload step below.
    discourse_types:
      type: string
      description: >-
        JSON-encoded string of {"major": [...], "minor": [...]}. See
        workflow_template above for why this is a string, not an object.
      default: '{"major": ["Lab Report", "Project Work", "Field Trip Report", "Model Making"], "minor": ["Concept Map", "Flow Chart", "Diagram", "Data Table", "Quiz"]}'
    model:
      type: string
      default: GPT-4.1
      description: Azure OpenAI chat deployment used for lesson-plan generation
    embed_model:
      type: string
      default: text-embedding-ada-002
      description: Azure OpenAI embedding deployment used for retrieval
    collection:
      type: string
      default: ""
      description: Qdrant collection. Leave empty to read it from each plan's chapter_info.index_path.
    top_k:
      type: integer
      minimum: 1
      default: 10
      description: Number of Qdrant passages retrieved per RAG section
    force_mode:
      type: string
      enum: ["", rag, gpt]
      default: ""
      description: Generate every section in this mode. Leave empty to use each section's own mode.
    webhook:
      type: boolean
      default: true
      description: Post PENDING, RUNNING, COMPLETED and FAILED status to WEBHOOK_URL
    concurrency:
      type: integer
      minimum: 1
      default: 1
      description: Number of lesson plans generated at the same time
  required: [workflow_template]
steps:
  - agent: page_chunking
    description: Split PDF pages
    config:
      mode: pdf
  - agent: extract
    description: Extract textbook metadata
    stage: analysis
    config:
      concurrency: 5
      foreach: "."
      input: '[.items[] | select(.metadata.page >= ${.config.start_page} and .metadata.page <= ${.config.end_page}) | .id]'
      path: ".metadata.shiksha_chapter"
      prompt: "${.config.prompt_template}"
      schema:
        type: object
        properties:
          board:
            type: string
            enum: [CBSE, BSE-TG, KSEEB]
            minLength: 1
            description: Curriculum board
          medium:
            type: string
            minLength: 1
            description: Instruction medium
            examples: [English]
          grade:
            type: integer
            minimum: 1
            description: Grade level
            examples: [6, 7]
          subject:
            type: string
            minLength: 1
            description: Subject name.
            examples: [Mathematics, Science, English]
          subject_norm:
            type: string
            minLength: 1
            description: Subject name for indices, these are usually shorter and lowercase. See examples.
            examples: [math, science, english, social]
        required: [board, medium, grade, subject, subject_norm]
  - agent: extract
    description: Extract table of contents
    stage: analysis
    config:
      retries: 3
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.toc_start_page} and .metadata.page <= ${.config.toc_end_page}) | .id]'
      path: ".metadata.toc"
      prompt: |
        You are an agent that searches a PDF until you find the table of contents page.
        The table of contents lists textbook chapters and their page numbers.
        Read page-by-page by invoking the see_next tool.
        Stop immediately once you have found the entire table of contents, then return the structured table of contents.
        Ignore appendices; only include actual textbook chapters.
      assertions:
        - expr: "[.records[:-1][] | select(.page_end == null)] | length == 0"
          feedback: "Only last TOC record may have null page_end"
        - expr: "[.records[].no] == [range(1; (.records | length) + 1)]"
          feedback: "Chapter numbers must be unique and sequential"
      schema:
        type: object
        properties:
          page_no:
            type: integer
            minimum: 1
            description: Page number where this table of contents is
          records:
            type: array
            description: Table of contents
            items:
              type: object
              properties:
                "no":
                  type: integer
                  minimum: 1
                  description: Textbook chapter number
                name:
                  type: string
                  minLength: 1
                  description: Official chapter title. Do not include chapter number or numbering prefix.
                  examples: [Electric Current, The Human Eye and the Colourful World]
                page_begin:
                  type: integer
                  minimum: 1
                  description: Page at which the chapter begins
                page_end:
                  type: [integer, "null"]
                  minimum: 1
                  description: Page at which the chapter ends. Use null only when uncertain and it is the last TOC record.
              required: ["no", "name", "page_begin", "page_end"]
        required: [page_no, records]
  - agent: extract
    description: Find Chapter 1 offset
    stage: analysis
    config:
      retries: 5
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.chapter_start_page} and .metadata.page <= ${.config.chapter_end_page}) | .id]'
      path: ".metadata.chapter_1_offset"
      prompt: |
        You are a textbook reading agent.
        Read page-by-page by invoking the see_next tool.
        Stop when you encounter Chapter 1 in the textbook.
        Return whether Chapter 1 was found and the page where it starts.
      schema:
        type: object
        properties:
          found:
            type: boolean
            description: Whether Chapter 1 was found
          page:
            type: integer
            description: Page where Chapter 1 starts
          reason:
            type: string
            description: Brief explanation
        required: [found, page]
    validation:
      - mode: after
        expr: ".metadata.chapter_1_offset.found == true"
        message: "Chapter 1 was not found: ${.metadata.chapter_1_offset.reason}"
  - agent: page_stitching
    description: Stitch chapter PDFs
    config:
      foreach: |
        . as $doc
        | .metadata as $m
        | ($m.chapter_1_offset.page - $m.toc.records[0].page_begin) as $offset
        | $m.toc.records[]
        | . as $r
        | {
            record: $r,
            context: (
              "- Chapter number: \($r.no)\n"
              + "- Chapter name: \($r.name)\n"
              + "- Subject: \($m.shiksha_chapter.subject)\n"
              + "- Grade: \($m.shiksha_chapter.grade)\n"
              + "- Educational board (India): \($m.shiksha_chapter.board)"
            ),
            ids: [
              $doc.items[]
              | select(.metadata.page >= ($offset + $r.page_begin) and .metadata.page <= (if $r.page_end == null then ($doc.items | length) else ($offset + $r.page_end) end))
              | .id
            ]
          }
      input: ".ids"
      metadata: '{record: .record, context: .context, content_type: "application/pdf"}'
      replace: true
    validation:
      - mode: after
        expr: "([.items[].metadata.record.no] | sort) == ([.metadata.toc.records[].no] | sort)"
        message: "Not all expected chapters were stitched (found ${[.items[].metadata.record.no]})"
  - agent: extract
    description: Extract chapter content
    config:
      retries: 5
      concurrency: 5
      foreach: ".items[]"
      input: "[.id]"
      context: ".metadata.context"
      path: ".metadata.chapter"
      prompt: |
        You are an agent that generates structured chapter content from a chapter PDF.

        Rules:
        - Topic titles must be copied verbatim from section and subsection headings in the textbook.
        - When collapsing content into a section heading, ensure all learning outcomes belong to that section and its subsections.
        - Do not attach learning outcomes from earlier sections to a later topic.
        - Learning outcomes should include concepts taught within the topic's section and its immediate subsections, but must not include content from later sections.
      assertions:
        - expr: '([ .topic_groups[].topics[] ] - [ .topics[].title ]) | unique | length == 0'
          feedback: "Unknown topics in topic_groups"
        - expr: '([ .topics[].title ] - [ .topic_groups[].topics[] ]) | unique | length == 0'
          feedback: "Topics missing from topic_groups"
      schema:
        type: object
        properties:
          topics:
            type: array
            minItems: 1
            description: Ordered topic-wise breakdown of the chapter
            items:
              type: object
              properties:
                numbering:
                  type: string
                  minLength: 2
                  pattern: '^\d+(?:\.\d+)+$'
                  description: The section numbering, beginning with the chapter number.
                  examples: ["1.1", "1.2.1"]
                title:
                  type: string
                  minLength: 1
                  description: Section or subsection title from the textbook, without numbering.
                  examples: [Introduction, Properties of Matter, Physical Changes]
                learning_outcomes:
                  type: array
                  minItems: 1
                  description: Outcomes students should achieve after learning this topic
                  items:
                    type: string
              required: [numbering, title, learning_outcomes]
          topic_groups:
            type: array
            minItems: 1
            description: Period-wise lesson groupings covering the chapter in teaching order
            items:
              type: object
              properties:
                topics:
                  type: array
                  minItems: 1
                  description: Topic titles from the chapter that are taught together in one lesson period
                  items:
                    type: string
              required: [topics]
        required: [topics, topic_groups]
  - agent: transform
    description: Build one API payload per chapter/topic-group, substituting the workflow template
    config:
      path: ".metadata.payloads"
      value: |
        ${.config.workflow_template} as $template
        | ($template._id) as $workflow_id
        | (if ${.config.created_at} > 0 then ${.config.created_at} else (now | floor) end) as $created_at
        | ${.config.discourse_types} as $discourse
        | ($discourse.major) as $discourse_major
        | ($discourse.minor) as $discourse_minor
        | .metadata.shiksha_chapter as $m
        | [
            .items[] as $item
            | ($item.metadata.record) as $r
            | ($item.metadata.chapter) as $c
            | ($c.topics | map({key: .title, value: .learning_outcomes}) | from_entries) as $topic_lo
            | (
                "qdrant/\($m.board)/chapter_id:Medium=\($m.medium | ascii_downcase),Grade=\($m.grade),Subject=\($m.subject_norm),Number=\($r.no)"
              ) as $index_path
            | ($c.topic_groups | to_entries[]) as $entry
            | ($entry.value.topics) as $group_topics
            | ($entry.key + 1) as $topic_counter
            | ([$group_topics[] as $t | $topic_lo[$t][]] | unique) as $group_los
            | ($group_topics | join(" & ")) as $t_title
            | ($group_los | join(", ")) as $t_los_str
            | ("CHAPTER: " + $r.name + "\nSUBTOPICS: " + $t_title + "\nLEARNING OUTCOMES: " + $t_los_str + "\n") as $context_str
            | ("Board=" + $m.board + ",Medium=" + ($m.medium | ascii_downcase) + ",Grade=" + ($m.grade | tostring) + ",Subject=" + $m.subject_norm + ",Number=" + ($r.no | tostring) + ",Title=" + $r.name) as $chapter_id
            | ("Board=" + $m.board + "/Medium=" + ($m.medium | ascii_downcase) + "/Grade=" + ($m.grade | tostring) + "/Subject=" + $m.subject_norm + "/Number=" + ($r.no | tostring) + "/Level=SUBTOPIC/Topics=" + $t_title) as $doc_id
            | ($template
               | if $topic_counter > 1 then .sections |= map(select(.id != "lesson_mind_mapping")) else . end
               | .sections |= map(.description |= (
                    gsub("\\$\\{READING_CONTENT\\}"; $context_str)
                    | gsub("\\$\\{DISCOURSE_TYPES_MAJOR\\}"; ($discourse_major | join("; ")))
                    | gsub("\\$\\{DISCOURSE_TYPES\\}"; ($discourse_minor | join("; ")))
                 ))
              ) as $workflow_payload
            | {
                _id: $doc_id,
                user_id: "ADMIN",
                created_at: $created_at,
                workflow_id: $workflow_id,
                chapter_id: $chapter_id,
                lp_level: "SUBTOPIC",
                lp_type_english: "NONE",
                subtopics: $group_topics,
                learning_outcomes: $group_los,
                chapter_info: {id: $chapter_id, chapter_title: $r.name, index_path: $index_path},
                workflow: $workflow_payload
              }
          ]
    validation:
      - mode: after
        expr: '[.metadata.payloads[] | select((.subtopics | length) == 0 or (.learning_outcomes | length) == 0)] | length == 0'
        message: "Payloads with empty subtopics or learning outcomes were generated"
  - agent: section_graph
    description: Generate one lesson plan per payload from the section dependency graph
    config:
      model: "${.config.model}"
      webhook: "${.config.webhook}"
      force_mode: "${.config.force_mode}"
      concurrency: "${.config.concurrency}"
      retrieve:
        embed_model: "${.config.embed_model}"
        collection: "${.config.collection}"
        top_k: "${.config.top_k}"
        vector_name: text-dense
      prompts:
        system: |-
          You are LessonPlanGPT, an AI tutor specialized in generating lesson-plan segments for real classroom use. When processing any segment-specific prompt, follow these guidelines:

          1. **Purpose & Audience**
          • Create student-appropriate content that teachers can deliver directly in K–12 classrooms.
          • Focus on enhancing students’ understanding and comprehension of the topics specified in the segment prompt.

          2. **Tone & Style**
          • Use simple, clear language that engages school-age learners.
          • Maintain an encouraging, respectful, and motivating voice—avoid jargon and overly technical phrasing.

          3. **Accuracy & Placeholders**
          • Do not invent or hallucinate details—if the prompt refers to figures, diagrams, vocabulary, or data, use placeholders exactly as provided.
          • Ensure all content is factually consistent and directly relevant to the topic in the prompt.

          4. **Clarity & Conciseness**
          • Keep each sentence focused and actionable.
          • Respect any sentence or paragraph length requirements specified in the prompt.
          • Ensure coherence, avoid repetition, and prioritize clear comprehension for students.
        summarize: |-
          You are an expert educational content analyzer. Please create a concise summary of the following lesson plan content that focuses on the most important information for avoiding content duplication in future lesson plans.

          Your summary should include:
          1. **Key Topics Covered**: Main subjects and concepts addressed
          2. **Learning Outcomes**: Primary learning objectives achieved
          3. **Pedagogical Strategies**: Teaching methods and approaches used
          4. **Activities**: Specific classroom activities or exercises mentioned
          5. **Keywords/Concepts**: Important terminology and concepts introduced

          Please format your response as a structured summary with clear sections. Keep it concise but comprehensive, focusing on information that would help avoid duplication in related lesson plans.

          Target length: Maximum {max} characters.

          Lesson Plan Content to Summarize:
          ---
          {text}
          ---

          Provide a structured summary:
        retrieval_query: |-
          You are an expert educational content retrieval specialist. Your task is to create an optimized search query to find the most relevant textbook content from a vector store containing school textbook chapters.

          **OBJECTIVE**: Generate a precise and effective retrieval query that will help find textbook content most relevant to the given section description, topics, and learning outcomes.

          **SECTION INFORMATION**:
          Section Description: {description}{extra}

          **QUERY GENERATION GUIDELINES**:
          1. **Focus on Key Concepts**: Identify the core educational concepts, topics, and subtopics that need to be retrieved
          2. **Use Educational Terminology**: Include relevant academic terms, subject-specific vocabulary, and pedagogical concepts
          3. **Consider Learning Objectives**: Align the query with what students need to learn and understand
          4. **Include Context Clues**: Add relevant grade-appropriate terms and conceptual frameworks
          5. **Optimize for Semantic Search**: Use natural language that captures the meaning and intent, not just keywords
          6. **Be Specific but Comprehensive**: Balance specificity with breadth to capture relevant content

          **QUERY STRUCTURE**:
          Create a retrieval query that includes:
          - Primary concepts and topics to search for
          - Related educational terms and vocabulary
          - Learning context and objectives
          - Subject-specific terminology where applicable

          **OUTPUT REQUIREMENTS**:
          - Maximum length: {max} characters
          - Format: Natural language query optimized for semantic search
          - Focus: Educational content retrieval from textbook chapters
          - Style: Clear, concise, and educationally relevant

          Generate the retrieval query:
        rag_answer: |-
          Context information from multiple sources is below.
          ---------------------
          {context}
          ---------------------
          Given the information from multiple sources and not prior knowledge, answer the query.
          Query: {query}
          Answer:
        journey: |-
          === LESSON PLAN STRUCTURE & LEARNING JOURNEY ===
          All sections in this lesson plan: {sections}

          IMPORTANT: This lesson plan should take students on a structured learning journey from the UNKNOWN to the KNOWN with respect to the topic. Each section should build upon previous sections and contribute to this progression:

          - Early sections should introduce foundational concepts and engage student curiosity
          - Middle sections should explore, explain, and elaborate on key concepts
          - Later sections should help students apply, evaluate, and consolidate their learning

          The current section '{current}' should fit logically into this learning progression, considering:
          1. What students should already know from previous sections
          2. What new knowledge/skills this section should develop
          3. How this section prepares students for subsequent sections
          4. The overall journey from unfamiliarity to mastery of the topic

          ===
        additional: |-
          === ADDITIONAL CONTEXT ===
          {text}
          ===
        fresh:
          subtopic: |-
            You are creating the '{title}' section of a lesson plan.
            Focus on the given subtopic(s) and their learning outcomes.
          chapter: |-
            You are creating the '{title}' section of a lesson plan.
            Focus on the given learning outcomes.
          outcomes: |-
            === CURRENT SECTION'S LEARNING OUTCOMES ===
            {query}
            ===
          deps: |-
            === PREVIOUSLY GENERATED SECTIONS ===

            The content of this section depends on the following previously generated sections:
            {deps}
            ===
          rag: "**Use the attached context passages (from the system) when relevant.**"
          json: |-
            Return a single JSON object ONLY matching this schema (no prose, no fences):
            {schema}
            If a field is empty, use "" or [] appropriately.
          md: |-
            Return Markdown ONLY (no code fences). Do NOT repeat the section description; generate the requested content.
          template: |-
            {intro}

            {journey}

            {outcomes}

            {additional}

            {deps}

            === CURRENT SECTION DESCRIPTION ===
            {description}
            **IMPORTANT: Follow the above section description EXACTLY. Adhere to the **CURRENT SECTION'S LEARNING OUTCOMES** to generate content for this section. All references of learning outcomes in the above description belong to **CURRENT SECTION'S LEARNING OUTCOMES** ONLY. Do NOT include the section title unless the output format asks for it.**
            ===
            {rag}

            {format}
        regen:
          subtopic: |-
            You are regenerating the '{title}' section of a lesson plan. Following are the subtopic(s) and their learning outcomes:

            {query}
          chapter: |-
            You are regenerating the '{title}' section of a lesson plan. Following is the chapter title and associated learning outcomes:

            {query}
          deps_current: |-
            The content of this section depends on the following previously generated sections:
            ```
            {deps}
            ```
          deps_previous: |-
            Below is the previously generated content for this section, along with any USER feedback provided for its regeneration (if available):
            ```
            {previous}
            ```
            **IMPORTANT: Carefully review and incorporate the USER feedback (if any) when regenerating this section. Ensure all feedback points are addressed.**
          rag: &retrieved_rag "**Refer to the retrieved content for context.**"
          json: &json_format |-
            The output should be in the following JSON format:
            {schema}
          md: &md_format "The output should be in plain string **Markdown** format for ease of readability. DO NOT annotate the output with any special characters. Do NOT repeat or regurgitate descriptions of sections provided above. Only generate relevant material as indicated in the section description."
          template: |-
            {intro}

            {journey}

            {additional}

            {deps}

            # Section Description: {description}

            **Note: Adhere to the mentioned learning outcomes and ensure the content is relevant to the chapter. DO NOT include section title in the output unless specifically mentioned in output format.** {rag}

            {format}
        resource:
          intro: "You are creating the '{title}' section of a resource plan for english subject."
          deps: |-
            The content of this section depends on the following previously generated sections:
            ```
            {deps}
            ```
          rag: *retrieved_rag
          json: *json_format
          md: *md_format
          template: |-
            {intro}

            {journey}

            {additional}

            {deps}

            # Current Section Description: {description}

            **Note: Adhere to the mentioned learning outcomes and ensure the content is relevant to the chapter. Do NOT include section title in the output unless specifically mentioned in output format.**
            {rag}

            {format}
