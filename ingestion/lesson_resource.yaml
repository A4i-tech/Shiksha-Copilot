pipeline_id: shiksha_lesson_resource
parameters:
  properties:
    start_page:
      type: integer
      minimum: 1
      default: 1
      description: First page used to extract textbook metadata
    end_page:
      type: integer
      minimum: 1
      default: 16
      description: Last page used to extract textbook metadata
    prompt_template:
      type: string
      default: You are a metadata creating agent for a school textbook. You return textbook metadata.
      description: Prompt used for textbook metadata extraction
    toc_start_page:
      type: integer
      minimum: 1
      default: 8
      description: First page to scan for the table of contents
    toc_end_page:
      type: integer
      minimum: 1
      default: 12
      description: Last page to scan for the table of contents
    chapter_start_page:
      type: integer
      minimum: 1
      default: 9
      description: First page to scan while finding Chapter 1 offset
    chapter_end_page:
      type: integer
      minimum: 1
      default: 18
      description: Last page to scan while finding Chapter 1 offset
    chapters:
      type: array
      default: []
      description: Textbook chapter numbers to process. Use [] to process all chapters.
      items:
        type: integer
        minimum: 1
    workflow_id:
      type: string
      default: telangana-additional-resources
      description: Workflow ID to write into generated lesson resource records
    created_at:
      type: integer
      minimum: 0
      default: 0
      description: Unix timestamp to write into generated records. Use 0 to use the pipeline run time.
    translate_to:
      type: [string, "null"]
      default: null
      description: Language code for translated lesson resources
steps:
  - agent: page_chunking
    description: Split PDF pages
    config:
      mode: pdf
  - agent: page_stitching
    description: Build textbook metadata sample
    config:
      foreach: |
        {
          ids: [
            .items[]
            | select(.metadata.page >= ${.config.start_page} and .metadata.page <= ${.config.end_page})
            | .id
          ]
        }
      input: ".ids"
      metadata: '{kind: "metadata_sample", content_type: "application/pdf"}'
      replace: false
  - agent: rasterize
    description: Rasterize textbook metadata sample
    config:
      foreach: '.items[] | select(.metadata.kind == "metadata_sample")'
      input: '[.id]'
      dpi: 120
  - agent: extract
    description: Extract textbook metadata
    stage: analysis
    config:
      concurrency: 5
      foreach: "."
      input: '[.items[] | select(.metadata.kind == "metadata_sample") | .id]'
      path: ".metadata.shiksha_chapter"
      prompt: "${.config.prompt_template}"
      schema:
        type: object
        properties:
          board:
            type: string
            enum: [CBSE, BSE-TG, KSEEB]
            minLength: 1
            description: Curriculum board
          medium:
            type: string
            minLength: 1
            description: Instruction medium (i.e., the language).
            examples: [English]
          grade:
            type: integer
            minimum: 1
            description: Grade level
            examples: [6, 7]
          subject:
            type: string
            minLength: 1
            description: Subject name.
            examples: [Mathematics, Science, English]
          subject_norm:
            type: string
            minLength: 1
            description: Subject name for indices, these are usually shorter and lowercase. See examples.
            examples: [math, science, english, social]
        required: [board, medium, grade, subject, subject_norm]
  - agent: extract
    description: Extract table of contents
    stage: analysis
    config:
      retries: 3
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.toc_start_page} and .metadata.page <= ${.config.toc_end_page}) | .id]'
      path: ".metadata.toc"
      prompt: |
        You are an agent that searches a PDF until you find the table of contents page.
        The table of contents lists textbook chapters and their page numbers.
        Read page-by-page by invoking the see_next tool.
        Stop immediately once you have found the entire table of contents, then return the structured table of contents.
        Ignore appendices; only include actual textbook chapters.
      assertions:
        - expr: "[.records[:-1][] | select(.page_end == null)] | length == 0"
          feedback: "Only last TOC record may have null page_end"
        - expr: "[.records[].no] == [range(1; (.records | length) + 1)]"
          feedback: "Chapter numbers must be unique and sequential"
      schema:
        type: object
        properties:
          page_no:
            type: integer
            minimum: 1
            description: Page number where this table of contents is
          records:
            type: array
            description: Table of contents
            items:
              type: object
              properties:
                "no":
                  type: integer
                  minimum: 1
                  description: Textbook chapter number
                name:
                  type: string
                  minLength: 1
                  description: Official chapter title. Do not include chapter number or numbering prefix.
                  examples: [Electric Current, The Human Eye and the Colourful World]
                page_begin:
                  type: integer
                  minimum: 1
                  description: Page at which the chapter begins
                page_end:
                  type: [integer, "null"]
                  minimum: 1
                  description: Page at which the chapter ends. Use null only when uncertain and it is the last TOC record.
              required: ["no", "name", "page_begin", "page_end"]
        required: [page_no, records]
  - agent: extract
    description: Find Chapter 1 offset
    stage: analysis
    config:
      retries: 5
      concurrency: 5
      foreach: "."
      mode: buffered
      input: '[.items[] | select(.metadata.page >= ${.config.chapter_start_page} and .metadata.page <= ${.config.chapter_end_page}) | .id]'
      path: ".metadata.chapter_1_offset"
      prompt: |
        You are a textbook reading agent.
        Read page-by-page by invoking the see_next tool.
        Stop when you encounter Chapter 1 in the textbook and return whether Chapter 1 was found and the page where it starts.
      schema:
        type: object
        properties:
          found:
            type: boolean
            description: Whether Chapter 1 was found
          page:
            type: integer
            description: Page where Chapter 1 starts
          reason:
            type: string
            description: Brief explanation
        required: [found, page]
    validation:
      - mode: after
        expr: ".metadata.chapter_1_offset.found == true"
        message: "Chapter 1 was not found: ${.metadata.chapter_1_offset.reason}"
  - agent: page_stitching
    description: Stitch chapter PDFs
    config:
      foreach: |
        . as $doc
        | .metadata as $m
        | ${.config.chapters} as $selected_chapters
        | ($m.chapter_1_offset.page - $m.toc.records[0].page_begin) as $offset
        | $m.toc.records[]
        | select(($selected_chapters | length) == 0 or (.no as $chapter_no | $selected_chapters | index($chapter_no)))
        | . as $r
        | {
            record: $r,
            context: (
              "- Chapter number: \($r.no)\n"
              + "- Chapter name: \($r.name)\n"
              + "- Subject: \($m.shiksha_chapter.subject)\n"
              + "- Grade: \($m.shiksha_chapter.grade)\n"
              + "- Educational board (India): \($m.shiksha_chapter.board)"
            ),
            ids: [
              $doc.items[]
              | select(.metadata.page >= ($offset + $r.page_begin) and .metadata.page <= (if $r.page_end == null then ($doc.items | length) else ($offset + $r.page_end) end))
              | .id
            ]
          }
      input: ".ids"
      metadata: '{record: .record, context: .context, content_type: "application/pdf"}'
      replace: true
    validation:
      - mode: after
        expr: |
          ${.config.chapters} as $selected
          | (if ($selected | length) == 0 then [.metadata.toc.records[].no] else $selected end | sort) as $expected
          | ([.items[].metadata.record.no] | sort) == $expected
        message: "Not all expected chapters were stitched (found ${[.items[].metadata.record.no]})"
  - agent: extract
    description: Extract chapter content
    config:
      retries: 5
      concurrency: 5
      foreach: ".items[]"
      input: "[.id]"
      context: ".metadata.context"
      path: ".metadata.chapter"
      prompt: |
        You are an agent that generates structured chapter content from a chapter PDF.

        Rules:
        - Topic titles must be copied verbatim from section and subsection headings in the textbook.
        - When collapsing content into a section heading, ensure all learning outcomes belong to that section and its subsections.
        - Do not attach learning outcomes from earlier sections to a later topic.
        - Learning outcomes should include concepts taught within the topic's section and its immediate subsections, but must not include content from later sections.
      schema:
        type: object
        properties:
          topics:
            type: array
            minItems: 1
            description: Ordered topic-wise breakdown of the chapter
            items:
              type: object
              properties:
                numbering:
                  type: string
                  minLength: 2
                  pattern: '^\d+(?:\.\d+)+$'
                  description: The section numbering, beginning with the chapter number.
                  examples: ["1.1", "1.2.1"]
                title:
                  type: string
                  minLength: 1
                  description: Section or subsection title from the textbook, without numbering.
                  examples: [Introduction, Properties of Matter, Physical Changes]
                learning_outcomes:
                  type: array
                  minItems: 1
                  description: Outcomes students should achieve after learning this topic
                  items:
                    type: string
              required: [numbering, title, learning_outcomes]
          topic_groups:
            type: array
            minItems: 1
            description: Period-wise lesson groupings covering the chapter in teaching order
            items:
              type: object
              properties:
                topics:
                  type: array
                  minItems: 1
                  description: Topic titles from the chapter that are taught together in one lesson period
                  items:
                    type: string
              required: [topics]
        required: [topics, topic_groups]
  - agent: extract
    description: Generate hands-on activity resource section
    stage: resource_generation
    config:
      retries: 5
      concurrency: 2
      foreach: ".items[]"
      input: "[.id]"
      context: |
        .metadata.context
        + "\n- Resource section: Hands-on Activity"
        + "\n- Learning outcomes:\n"
        + ([.metadata.chapter.topics[].learning_outcomes[]] | unique | map("  - " + .) | join("\n"))
      path: ".metadata.resource_sections.hands_on_activity"
      prompt: |
        You are creating the 'Hands-on Activity' section of a lesson plan.
        Focus on the given learning outcomes.

        === LESSON PLAN STRUCTURE & LEARNING JOURNEY ===
        All sections in this lesson plan: Hands-on Activity, Real-world Scenario, Question Bank

        IMPORTANT: This lesson plan should take students on a structured learning journey from the UNKNOWN to the KNOWN with respect to the topic. Each section should build upon previous sections and contribute to this progression:

        - Early sections should introduce foundational concepts and engage student curiosity
        - Middle sections should explore, explain, and elaborate on key concepts
        - Later sections should help students apply, evaluate, and consolidate their learning
        - Represent all variables, formulas, equations, inequalities, units with mathematical notation, and symbolic calculations as valid LaTeX mathematics. Use inline mathematics within sentences and display mathematics for equations presented on their own line. Do not emit plain-text or Unicode approximations when LaTeX notation is appropriate.

        The current section 'Hands-on Activity' should fit logically into this learning progression, considering:
        1. What students should already know from previous sections
        2. What new knowledge/skills this section should develop
        3. How this section prepares students for subsequent sections
        4. The overall journey from unfamiliarity to mastery of the topic

        ===
        === CURRENT SECTION'S LEARNING OUTCOMES ===
        The current chapter context and learning outcomes are provided as separate context.
        ===
        === CURRENT SECTION DESCRIPTION ===
        Generate practical classroom activities for the chapter. Activities must be grounded in the textbook content and learning outcomes, feasible for a school classroom, and written so a teacher can prepare and run them directly. Include clear preparation, required materials, how to obtain materials, and a recap that connects the activity back to the learning outcomes.
        **IMPORTANT: Follow the above section description EXACTLY. Adhere to the **CURRENT SECTION'S LEARNING OUTCOMES** to generate content for this section. All references of learning outcomes in the above description belong to **CURRENT SECTION'S LEARNING OUTCOMES** ONLY. Do NOT include the section title unless the output format asks for it.**
        ===
        **Use the attached context passages (from the system) when relevant.**

        Return a single JSON object ONLY matching the configured structured output schema (no prose, no fences).
        If a field is empty, use "" or [] appropriately.
      schema:
        type: object
        description: Hands-on activities keyed by stable activity IDs.
        properties:
          activity_1:
            type: object
            description: First classroom-ready hands-on activity.
            properties:
              title:
                type: string
                description: Short activity name.
              preparation:
                type: string
                description: What the teacher or students should set up before starting.
              required_materials:
                type: string
                description: Materials needed to run the activity.
              obtaining_materials:
                type: string
                description: Practical ways to source or substitute the materials locally.
              recap:
                type: string
                description: How the teacher should debrief the activity and connect it to the chapter learning outcomes.
            required: [title, preparation, required_materials, obtaining_materials, recap]
          activity_2:
            type: object
            description: Second classroom-ready hands-on activity.
            properties:
              title:
                type: string
                description: Short activity name.
              preparation:
                type: string
                description: What the teacher or students should set up before starting.
              required_materials:
                type: string
                description: Materials needed to run the activity.
              obtaining_materials:
                type: string
                description: Practical ways to source or substitute the materials locally.
              recap:
                type: string
                description: How the teacher should debrief the activity and connect it to the chapter learning outcomes.
            required: [title, preparation, required_materials, obtaining_materials, recap]
        required: [activity_1, activity_2]
  - agent: extract
    description: Generate real-world scenario resource section
    stage: resource_generation
    config:
      retries: 5
      concurrency: 2
      foreach: ".items[]"
      input: "[.id]"
      context: |
        .metadata.context
        + "\n- Resource section: Real-world Scenario"
        + "\n- Learning outcomes:\n"
        + ([.metadata.chapter.topics[].learning_outcomes[]] | unique | map("  - " + .) | join("\n"))
      path: ".metadata.resource_sections.real_world_scenario"
      prompt: |
        You are creating the 'Real-world Scenario' section of a lesson plan.
        Focus on the given learning outcomes.

        === LESSON PLAN STRUCTURE & LEARNING JOURNEY ===
        All sections in this lesson plan: Hands-on Activity, Real-world Scenario, Question Bank

        IMPORTANT: This lesson plan should take students on a structured learning journey from the UNKNOWN to the KNOWN with respect to the topic. Each section should build upon previous sections and contribute to this progression:

        - Early sections should introduce foundational concepts and engage student curiosity
        - Middle sections should explore, explain, and elaborate on key concepts
        - Later sections should help students apply, evaluate, and consolidate their learning
        - Represent all variables, formulas, equations, inequalities, units with mathematical notation, and symbolic calculations as valid LaTeX mathematics. Use inline mathematics within sentences and display mathematics for equations presented on their own line. Do not emit plain-text or Unicode approximations when LaTeX notation is appropriate.

        The current section 'Real-world Scenario' should fit logically into this learning progression, considering:
        1. What students should already know from previous sections
        2. What new knowledge/skills this section should develop
        3. How this section prepares students for subsequent sections
        4. The overall journey from unfamiliarity to mastery of the topic

        ===
        === CURRENT SECTION'S LEARNING OUTCOMES ===
        The current chapter context and learning outcomes are provided as separate context.
        ===
        === CURRENT SECTION DESCRIPTION ===
        Generate real-world scenarios that connect the chapter concepts to familiar student experiences and local Indian classroom/community contexts. For each difficulty level, provide scenarios with a title, a concrete description, and a question that prompts application of the chapter learning outcomes.
        **IMPORTANT: Follow the above section description EXACTLY. Adhere to the **CURRENT SECTION'S LEARNING OUTCOMES** to generate content for this section. All references of learning outcomes in the above description belong to **CURRENT SECTION'S LEARNING OUTCOMES** ONLY. Do NOT include the section title unless the output format asks for it.**
        ===
        **Use the attached context passages (from the system) when relevant.**

        Return a single JSON object ONLY matching the configured structured output schema (no prose, no fences).
        If a field is empty, use "" or [] appropriately.
      schema:
        type: object
        description: Real-world scenarios grouped by difficulty level.
        properties:
          beginner:
            type: object
            description: Scenarios for foundational recall and simple application.
            properties:
              topic_1:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
              topic_2:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
            required: [topic_1, topic_2]
          intermediate:
            type: object
            description: Scenarios for concept connection and explanation.
            properties:
              topic_1:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
              topic_2:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
            required: [topic_1, topic_2]
          advanced:
            type: object
            description: Scenarios for analysis, comparison, and evaluation.
            properties:
              topic_1:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
              topic_2:
                type: object
                properties:
                  title:
                    type: string
                  scenario:
                    type: object
                    properties:
                      description:
                        type: string
                      question:
                        type: string
                    required: [description, question]
                required: [title, scenario]
            required: [topic_1, topic_2]
        required: [beginner, intermediate, advanced]
  - agent: extract
    description: Generate question bank resource section
    stage: resource_generation
    config:
      retries: 5
      concurrency: 2
      foreach: ".items[]"
      input: "[.id]"
      context: |
        .metadata.context
        + "\n- Resource section: Question Bank"
        + "\n- Learning outcomes:\n"
        + ([.metadata.chapter.topics[].learning_outcomes[]] | unique | map("  - " + .) | join("\n"))
      path: ".metadata.resource_sections.question_bank"
      prompt: |
        You are creating the 'Question Bank' section of a lesson plan.
        Focus on the given learning outcomes.

        === LESSON PLAN STRUCTURE & LEARNING JOURNEY ===
        All sections in this lesson plan: Hands-on Activity, Real-world Scenario, Question Bank

        IMPORTANT: This lesson plan should take students on a structured learning journey from the UNKNOWN to the KNOWN with respect to the topic. Each section should build upon previous sections and contribute to this progression:

        - Early sections should introduce foundational concepts and engage student curiosity
        - Middle sections should explore, explain, and elaborate on key concepts
        - Later sections should help students apply, evaluate, and consolidate their learning
        - Represent all variables, formulas, equations, inequalities, units with mathematical notation, and symbolic calculations as valid LaTeX mathematics. Use inline mathematics within sentences and display mathematics for equations presented on their own line. Do not emit plain-text or Unicode approximations when LaTeX notation is appropriate.

        The current section 'Question Bank' should fit logically into this learning progression, considering:
        1. What students should already know from previous sections
        2. What new knowledge/skills this section should develop
        3. How this section prepares students for subsequent sections
        4. The overall journey from unfamiliarity to mastery of the topic

        ===
        === CURRENT SECTION'S LEARNING OUTCOMES ===
        The current chapter context and learning outcomes are provided as separate context.
        ===
        === CURRENT SECTION DESCRIPTION ===
        Generate a question bank for the chapter across beginner, intermediate, and advanced difficulty levels. Each level must include MCQs and assessment questions grounded in the textbook and learning outcomes. MCQs should have one clear correct answer among plausible options, and assessment questions should test conceptual understanding, application, analysis, or evaluation appropriate to the difficulty level.
        **IMPORTANT: Follow the above section description EXACTLY. Adhere to the **CURRENT SECTION'S LEARNING OUTCOMES** to generate content for this section. All references of learning outcomes in the above description belong to **CURRENT SECTION'S LEARNING OUTCOMES** ONLY. Do NOT include the section title unless the output format asks for it.**
        ===
        **Use the attached context passages (from the system) when relevant.**

        Return a single JSON object ONLY matching the configured structured output schema (no prose, no fences).
        If a field is empty, use "" or [] appropriately.
      schema:
        type: object
        description: Question bank grouped by difficulty level.
        properties:
          beginner:
            type: object
            properties:
              MCQs:
                type: object
                properties:
                  content:
                    type: array
                    description: Multiple-choice questions for beginner level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                        options:
                          type: array
                          minItems: 4
                          maxItems: 4
                          items:
                            type: string
                      required: [question, options]
                required: [content]
              assessment:
                type: object
                properties:
                  content:
                    type: array
                    description: Short or long answer questions for beginner level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                      required: [question]
                required: [content]
            required: [MCQs, assessment]
          intermediate:
            type: object
            properties:
              MCQs:
                type: object
                properties:
                  content:
                    type: array
                    description: Multiple-choice questions for intermediate level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                        options:
                          type: array
                          minItems: 4
                          maxItems: 4
                          items:
                            type: string
                      required: [question, options]
                required: [content]
              assessment:
                type: object
                properties:
                  content:
                    type: array
                    description: Short or long answer questions for intermediate level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                      required: [question]
                required: [content]
            required: [MCQs, assessment]
          advanced:
            type: object
            properties:
              MCQs:
                type: object
                properties:
                  content:
                    type: array
                    description: Multiple-choice questions for advanced level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                        options:
                          type: array
                          minItems: 4
                          maxItems: 4
                          items:
                            type: string
                      required: [question, options]
                required: [content]
              assessment:
                type: object
                properties:
                  content:
                    type: array
                    description: Short or long answer questions for advanced level.
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                      required: [question]
                required: [content]
            required: [MCQs, assessment]
        required: [beginner, intermediate, advanced]
  - agent: transform
    description: Build Shiksha lesson resource JSON
    config:
      value: |
        . as $doc
        | $doc.metadata.shiksha_chapter as $m
        | (if ${.config.created_at} > 0 then ${.config.created_at} else (now | floor) end) as $created_at
        | ($doc.items | sort_by(.metadata.record.no)) as $items
        | ($items | map(
            .metadata.record as $r
            | .metadata.chapter as $c
            | [ $c.topics[].learning_outcomes[] ] as $learning_outcomes
            | {
                "_id": (
                  "Board=\($m.board)/"
                  + "Medium=\($m.medium | ascii_downcase)/"
                  + "Grade=\($m.grade)/"
                  + "Subject=\($m.subject_norm)/"
                  + "Number=\($r.no)/"
                  + "Level=CHAPTER/"
                  + "Topics=RESOURCES"
                ),
                created_at: $created_at,
                workflow_id: "${.config.workflow_id}",
                chapter_id: (
                  "Board=\($m.board),"
                  + "Medium=\($m.medium | ascii_downcase),"
                  + "Grade=\($m.grade),"
                  + "Subject=\($m.subject_norm),"
                  + "Number=\($r.no),"
                  + "Title=\($r.name)"
                ),
                subtopics: [],
                learning_outcomes: ($learning_outcomes | unique),
                lp_level: "CHAPTER",
                lp_type_english: "NONE",
                sections: [
                  {
                    section_id: "section_hands_on_activity",
                    section_title: "Hands-on Activity",
                    content: .metadata.resource_sections.hands_on_activity
                  },
                  {
                    section_id: "section_real_world_scenario",
                    section_title: "Real-world Scenario",
                    content: .metadata.resource_sections.real_world_scenario
                  },
                  {
                    section_id: "section_question_bank",
                    section_title: "Question Bank",
                    content: .metadata.resource_sections.question_bank
                  }
                ]
              }
          )) as $shiksha
        | $doc.metadata + {
            shiksha: $shiksha,
            shiksha_out_path: ($items | map("grade\($m.grade)/\($m.subject_norm)/\(.metadata.record.no)/resources.json"))
          }
      path: ".metadata"
  - agent: translate
    description: Translate Shiksha lesson resource JSON
    validation:
      - mode: condition
        expr: '${if .config.translate_to == null then "false" else "true" end}'
        message: Translation not requested
    config:
      src: en
      dst: '${.config.translate_to // ""}'
      input: ".metadata.shiksha"
      path: ".metadata.shiksha_translated"
      skip_fields: ["*._id", "*.workflow_id", "*.chapter_id", "*.lp_level", "*.lp_type_english", "*.sections.*.section_id"]
