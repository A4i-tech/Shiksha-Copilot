services:

  shiksha-api-svc:
    image: ${API_IMAGE_TAG:-shiksha-api-local}
    build:
      context: .
      dockerfile: ./shiksha-api/app-service/Dockerfile
    container_name: shiksha-api-uat-container
    labels:
      environment: "uat"
      com.shiksha.service: "api"
    env_file:
      - ./shiksha-api/app-service/.env
    ports:
      - "0.0.0.0:5000:5000"
    restart: unless-stopped
    networks:
      - shiksha-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shiksha-be-svc:
    image: ${BE_IMAGE_TAG:-shiksha-backend-local}
    build:
      context: ./shiksha-website/shiksha-backend
      dockerfile: Dockerfile
    container_name: shiksha-be-uat-container
    labels:
      environment: "uat"
      com.shiksha.service: "backend"
    env_file:
      - ./shiksha-website/shiksha-backend/.env
    ports:
      - "0.0.0.0:8080:8080"
    restart: unless-stopped
    depends_on:
      shiksha-api-svc:
        condition: service_healthy
    networks:
      - shiksha-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shiksha-fe-svc:
    image: ${FE_IMAGE_TAG:-shiksha-frontend-local}
    build:
      context: ./shiksha-website/shiksha-frontend
      dockerfile: Dockerfile
    container_name: shiksha-fe-uat-container
    labels:
      environment: "uat"
      com.shiksha.service: "frontend"
    env_file:
      - ./shiksha-website/shiksha-frontend/.env
    ports:
      - "0.0.0.0:8000:8000"
    restart: unless-stopped
    depends_on:
      shiksha-be-svc:
        condition: service_healthy
    networks:
      - shiksha-network

networks:
  shiksha-network:
    external: true
    name: shiksha-network
